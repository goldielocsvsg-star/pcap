<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNC Capstone · Modules 5–6 · 120-Question NGN Practice Exam</title>
<style>
:root{--black:#0e0a14;--night:#170f22;--purple:#3b1d5e;--purple2:#2a1545;--violet:#5a2f8c;--lav:#c8b4f0;--lav2:#efe8ff;--orange:#ff8a2a;--orange-d:#a94a00;--cream:#fff8ec;--ink:#231833;--muted:#64557a;--ok:#1e7a4f;--okbg:#e2f5ea;--no:#b3283a;--nobg:#fde6e9;--part:#8a5a00;--partbg:#fff1d6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.55;color:var(--cream);background:var(--black);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 600px at 90% -10%,#3d1f63 0%,transparent 60%),radial-gradient(800px 500px at -10% 110%,#2b1240 0%,transparent 60%),var(--black)}
.fog{position:fixed;left:-20%;right:-20%;bottom:-40px;height:220px;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(200,180,240,.12),transparent);filter:blur(10px);animation:fog 22s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(8%)}}
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2}
button{font:inherit}
.wrap{max-width:920px;margin:0 auto;padding:16px 16px 80px}
.hidden{display:none!important}
/* buttons */
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--orange);color:#1a0f00;transition:transform .12s,box-shadow .2s;min-height:44px}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 18px rgba(255,138,42,.55)}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,.mode:focus-within,.ghostbtn:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--cream);border:2px solid var(--lav)}
.panel .btn.sec,.mbox .btn.sec{color:var(--violet);border-color:var(--violet)}
.btn.sec:hover:not(:disabled){box-shadow:0 0 14px rgba(200,180,240,.4)}
.btn.dark{background:var(--purple);color:var(--cream);border:1px solid #6d4aa0}
.btn.flag-on{background:#ffd9b5;color:#5a2500}
.btn.small{padding:7px 14px;min-height:36px;font-size:.9rem}
/* start */
.hero{text-align:center;padding:28px 8px 8px}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);margin:8px 0 4px;color:var(--orange);text-shadow:0 0 22px rgba(255,138,42,.45)}
.hero p{color:var(--lav);margin:4px 0}
.ghost{width:86px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}
@keyframes float{50%{transform:translateY(-10px)}}
.lantern{display:inline-block;animation:flicker 3.2s infinite}
@keyframes flicker{0%,100%{opacity:1}45%{opacity:.85}50%{opacity:.6}55%{opacity:.95}}
.panel{background:var(--cream);color:var(--ink);border-radius:22px;padding:22px clamp(16px,4vw,32px);margin:18px 0;box-shadow:0 0 0 2px rgba(200,180,240,.35),0 20px 50px rgba(0,0,0,.5);position:relative}
.panel h2{color:var(--violet);margin:0 0 10px;font-size:1.45rem}
.panel h3{color:var(--violet);margin:18px 0 8px;font-size:1.15rem}
.web{position:absolute;top:0;right:0;width:90px;height:90px;opacity:.35;pointer-events:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.fact{background:var(--lav2);border-radius:14px;padding:10px;text-align:center}
.fact b{display:block;font-size:1.5rem;color:var(--violet);font-family:Georgia,serif}
.fact span{font-size:.82rem;color:var(--muted);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:10px 0}
.mode{display:block;border:2px solid #d9cbf3;border-radius:16px;padding:14px 16px;cursor:pointer;background:#fff;transition:border-color .15s}
.mode input{accent-color:var(--violet);width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.mode b{color:var(--violet)}
.mode p{margin:6px 0 0;font-size:.92rem;color:var(--muted)}
.mode.sel{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,138,42,.25)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--violet);margin-top:2px;flex:0 0 auto}
.chk small{display:block;font-weight:400;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.note{font-size:.9rem;color:var(--muted)}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(14,10,20,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(200,180,240,.2)}
.topin{max-width:920px;margin:0 auto;padding:10px 16px 10px}
.brand{font-family:Georgia,serif;color:var(--orange);font-weight:700;font-size:1.1rem}
.modepill{font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--purple);color:var(--lav);border-radius:999px;padding:4px 10px;border:1px solid #6d4aa0}
.bar{height:10px;border-radius:99px;background:#2c2140;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#ffb36b);width:0;transition:width .4s}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--lav)}
.stats b{color:var(--cream)}
.stats .okc b{color:#7fe0ad}.stats .noc b{color:#ff9aa8}
/* question */
.qhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.qnum{font-family:Georgia,serif;font-size:1.25rem;font-weight:700;color:var(--violet);margin-right:6px}
.chip{font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:var(--lav2);color:var(--violet)}
.chip.sata{background:var(--orange);color:#1a0f00}
.chip.case{background:var(--purple);color:var(--cream)}
.chip.flag{background:#ffd9b5;color:#5a2500}
.case{background:#f4eefe;border-left:5px solid var(--violet);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.97rem}
.case summary{cursor:pointer;font-weight:800;color:var(--violet)}
.case p{margin:8px 0 0}
.update{background:#fff1e3;border-left:5px solid var(--orange);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.97rem}
.update b{color:var(--orange-d)}
.stem{font-weight:700;font-size:1.06rem;margin:12px 0}
.instr{font-size:.9rem;color:var(--orange-d);font-weight:700;margin:-4px 0 8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid #ddd0f2;border-radius:14px;background:#fff;color:var(--ink);padding:11px 14px;cursor:pointer;transition:border-color .12s,background .12s;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--orange)}
.opt .k{flex:0 0 30px;height:30px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--violet);color:var(--violet);font-weight:800;font-size:.9rem}
.opt.sata .k{border-radius:7px}
.opt.sel{border-color:var(--violet);background:#f1eaff}
.opt.sel .k{background:var(--violet);color:#fff}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--nobg)}
.opt.wrong .k{background:var(--no);border-color:var(--no);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.tagl{margin-left:auto;font-size:.75rem;font-weight:800;white-space:nowrap;padding-left:8px}
.saved{font-size:.88rem;font-weight:700;color:var(--ok)}
.unsaved{font-size:.88rem;font-weight:700;color:var(--orange-d)}
/* feedback */
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;border:2px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.no{background:var(--nobg);border-color:var(--no)}
.fb.part{background:var(--partbg);border-color:#d79b2a}
.fb h3{margin:0 0 6px;font-size:1.15rem;color:var(--ink)}
.fb p{margin:6px 0}
.why{list-style:none;padding:0;margin:8px 0}
.why li{padding:7px 0;border-top:1px dashed rgba(35,24,51,.18);font-size:.95rem}
.why .L{font-weight:800;display:inline-block;min-width:28px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.meta span{background:#fff;border:1px solid #d9cbf3;border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--violet);font-weight:700}
.trap{background:#2a1545;color:var(--cream);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:.95rem}
.trap b{color:var(--orange)}
/* nav */
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:18px}
.nav .grp{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:10px 0}
.cell{position:relative;height:42px;border-radius:10px;border:2px solid #d9cbf3;background:#fff;color:var(--ink);font-weight:800;cursor:pointer;font-size:.9rem}
.cell.ans{background:#e6dcfa;border-color:var(--violet)}
.cell.c{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.cell.x{background:var(--nobg);border-color:var(--no);color:var(--no)}
.cell.p{background:var(--partbg);border-color:#d79b2a;color:var(--part)}
.cell.cur{outline:3px solid var(--orange);outline-offset:1px}
.cell.fl::after{content:"🚩";position:absolute;top:-9px;right:-6px;font-size:.8rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
/* report */
.verdict{text-align:center;padding:18px;border-radius:18px;background:linear-gradient(150deg,var(--purple),var(--black));color:var(--cream);margin-bottom:14px}
.verdict .big{font-family:Georgia,serif;font-size:3rem;color:var(--orange);line-height:1}
.verdict h2{color:var(--cream);margin:8px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--lav2);border-radius:14px;padding:12px}
.tile small{display:block;color:var(--muted);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.tile b{font-size:1.35rem;color:var(--violet);font-family:Georgia,serif}
.tile span{display:block;font-size:.85rem;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.hbar .t{height:14px;background:#e9e1f7;border-radius:99px;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px}
.hbar .v{text-align:right;font-weight:800;color:var(--violet)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:440px}
th{background:var(--violet);color:#fff;text-align:left;padding:8px 10px}
td{padding:8px 10px;border-top:1px solid #eadff9}
tr:nth-child(even) td{background:#faf6ff}
.reclist li{margin:8px 0}
#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140px);background:var(--purple);color:var(--cream);border:2px solid var(--orange);padding:10px 16px;border-radius:14px;z-index:60;transition:transform .3s;max-width:92vw;font-weight:700}
#toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,6,16,.75);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--cream);color:var(--ink);border-radius:20px;padding:22px;max-width:480px;width:100%;box-shadow:0 0 0 3px var(--violet)}
.mbox h3{margin:0 0 8px;color:var(--violet);font-family:Georgia,serif}
@media(max-width:600px){body{font-size:16px}.nav .grp{width:100%}.nav .grp .btn{flex:1}.hbar{grid-template-columns:1fr 46px}.hbar .t{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.nav,.fog,.stars{display:none!important}}

.fact{background:var(--lav2)}
/* NGN item types */
.case .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;border-bottom:2px solid #d9cbf3}
.tab{border:1px solid #d9cbf3;border-bottom:0;background:#fff;color:var(--violet);font-weight:700;font-size:.85rem;padding:7px 12px;border-radius:10px 10px 0 0;cursor:pointer;min-height:36px}
.tab.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.tabp{background:#fff;border:1px solid #e3d5f7;border-top:0;border-radius:0 0 12px 12px;padding:10px 12px}
.tabp p{margin:0}
table.ehr{min-width:0;font-size:.88rem}
table.ehr th{background:#5a2f8c;padding:6px 8px}table.ehr td{padding:6px 8px}
table.mx{min-width:520px;font-size:.92rem}
table.mx th{font-size:.82rem;text-align:center}table.mx th:first-child{text-align:left}
table.mx td:first-child{font-weight:600;color:var(--ink)}
.mxc{text-align:center}
.mxc label{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px}
.mxc input{width:20px;height:20px;accent-color:var(--violet)}
.mxl{position:absolute;left:-9999px}
.mxc.right{background:var(--okbg)!important}.mxc.missed{background:var(--okbg)!important;box-shadow:inset 0 0 0 2px var(--ok)}.mxc.wrong{background:var(--nobg)!important}
.cloze{background:#fff;border:2px solid #ddd0f2;border-radius:14px;padding:14px 16px;line-height:2.4;font-size:1rem}
.cloze select{font:inherit;font-size:.95rem;max-width:100%;padding:6px 8px;border-radius:8px;border:2px solid var(--violet);background:#f7f2ff;color:var(--ink);margin:2px 0}
.cloze select.right{border-color:var(--ok);background:var(--okbg)}.cloze select.wrong{border-color:var(--no);background:var(--nobg)}
@media(max-width:600px){.cloze select{width:100%}}

/* ===== Professional theme layer ===== */

.modepill{background:#e6f4f7;color:#0e5466;border:1px solid #b6dde6}

<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="fog" aria-hidden="true"></div>
<header class="top hidden" id="top"><div class="topin">
  <div class="row between"><div class="row"><span class="brand">PNC Capstone · Practice Exam</span><span class="modepill" id="modePill"></span></div>
  <div class="row"><button class="btn small dark" id="mapBtn" aria-expanded="false">Question map</button><button class="btn small sec" id="finishBtn">Finish exam</button></div></div>
  <div class="bar" role="progressbar" aria-label="Percent completed" aria-valuemin="0" aria-valuemax="100" id="pbar"><i id="pbarI"></i></div>
  <div class="stats" id="stats" aria-live="polite"></div>
</div></header>
<main class="wrap" id="app"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="mbox" id="mbox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== NGN CASE STUDIES 1–5 ===== */
const STEPS={RC:'Recognize Cues',AC:'Analyze Cues',PH:'Prioritize Hypotheses',GS:'Generate Solutions',TA:'Take Action',EO:'Evaluate Outcomes'};
const TOPICS={
T1:['Safety events & error classification','Re-study medical error vs adverse event vs near miss vs sentinel/never events, omission vs commission, and the reasonable-and-prudent standard for negligence.'],
T2:['Incident reporting & documentation','Review who files the incident report and when, what goes in it, and what never goes in the chart (no mention of the report, no blame or speculation).'],
T3:['Just Culture & safety culture','Practice classifying human error (console), at-risk behavior (coach) and reckless behavior (discipline); review how leaders build psychological safety.'],
T4:['High-reliability organizations','Drill the five HRO principles: sensitivity to operations, preoccupation with failure, reluctance to simplify, deference to expertise, commitment to resilience.'],
T5:['Systems thinking & latent failures','Review active vs latent failures, the Swiss Cheese Model, and why patterns across staff point to the process.'],
T6:['RCA & countermeasures','Review the RCA sequence, common RCA mistakes, Fishbone categories, and strong vs weak countermeasures (forcing functions > reminders).'],
T7:['QI methods, PDSA & tools','Review the Model for Improvement, aim statements, small PDSA tests, and tool choice (Pareto, fishbone, run chart, flowchart).'],
T8:['Quality measures (Donabedian, STEEEP, indicators)','Sort structure vs process vs outcome, the six STEEEP aims, nurse-sensitive indicators, benchmarking, and TJC/CMS/VBP/NPSG roles.'],
T9:['Preventable risks, technology & engagement','Review falls, VTE, HAIs/CLABSI, pressure injury, failure to rescue, BCMA/alarm workarounds, and patient/family engagement.'],
T10:['SBAR, assertion & escalation','Practice SBAR (especially Assessment and Recommendation), the five assertion steps, the Two-Challenge Rule, CUS and chain of command.'],
T11:['Handoffs & closed-loop communication','Review I-PASS, bedside handoff, call-out, check-back and teach-back distinctions.'],
T12:['TeamSTEPPS tools & team outcomes','Review brief/huddle/debrief, STEP, STAR, I\'M SAFE, cross-monitoring, task assistance and TeamSTEPPS outcomes.'],
T13:['Communication techniques, barriers & conflict','Review therapeutic vs non-therapeutic responses, barriers (authority gradient, filtration), styles, fallacies, DESC and collaborative negotiation.'],
T14:['Culture, health literacy & transitions','Review qualified interpreters, speaking to the patient, teach-back, plain language, disability adaptations and safe discharge planning.'],
T15:['Collaboration & shared decision-making','Review SHARE and nurse–patient, intraprofessional, interprofessional and interorganizational collaboration.']
};
const CASES={};const Q=[];
const addCase=(k,n,title,tabs)=>{CASES[k]={n,title,tabs};};

/* ---------------- CASE 1 ---------------- */
addCase('C1',1,'The 90-Second Handoff',[
['Nurses\' Notes','1630: 74-year-old male transferred from ED to telemetry for atrial fibrillation with rapid ventricular response. ED nurse gave a 90-second phone report: "He\'s stable, the drip is running, and his family is on the way." No standardized handoff tool was used.\n1640: On arrival the patient states, "I feel lightheaded when I sit up." Skin cool to touch. Alert and oriented ×4. Lungs clear. Diltiazem infusing at 15 mg/hr per pump display.'],
['Vital Signs',[['Time','HR','BP','RR','SpO2'],['1430 (ED)','148 irregular','134/82','20','95% RA'],['1515 (ED)','96 irregular','118/70','18','96% RA'],['1640 (unit)','48 irregular','86/50','18','96% RA']]],
['Orders / MAR',[['Order / dose','Time'],['Metoprolol 5 mg IV push — given','1440'],['Metoprolol 5 mg IV push — given','1455'],['Diltiazem infusion — start at 15 mg/hr','1500'],['Diltiazem infusion — decrease to 5 mg/hr','1530'],['Potassium 4.1 mEq/L (resulted)','1520']]]]);

Q.push(
{id:'c1_1',cs:'C1',mod:6,t:'sata',step:'RC',topic:'T11',concept:'Recognizing cues after an incomplete handoff',
q:'The nurse reviews the medical record at 1640. Which findings require immediate follow-up? Select all that apply.',
o:[['Heart rate 48 beats/min','1',''],['Potassium 4.1 mEq/L',0,''],['Blood pressure 86/50 mm Hg',1,''],['Report of lightheadedness when sitting up',1,''],['SpO2 96% on room air',0,''],['Diltiazem infusing at 15 mg/hr',1,''],['Irregular cardiac rhythm',0,'']].map(x=>x),
r:'Bradycardia, hypotension and symptomatic lightheadedness after two beta-blocker doses plus a calcium-channel blocker infusion indicate excessive rate-control effect. The pump is still running at three times the active order (5 mg/hr since 1530), so the error is ongoing. Potassium and oxygenation are normal, and an irregular rhythm is expected with atrial fibrillation.',
trap:'The ED called him "stable." NGN tests whether you trust current objective data over someone else\'s label.',
why:['Bradycardia indicates excessive rate-control effect.','Within normal limits; not an immediate concern.','Hypotension suggests hypoperfusion.','Symptom of reduced cerebral perfusion and a fall risk.','Adequate oxygenation.','The infusion is running at 3× the active order — an active, ongoing error.','Expected with atrial fibrillation; the concern is the rate, not the irregularity.']},
{id:'c1_2',cs:'C1',mod:6,t:'matrix',step:'AC',topic:'T11',concept:'Linking cues to drug effect vs communication failure',
q:'For each finding, indicate what it is most consistent with.',
cols:['Excessive rate-control drug effect','Handoff/verification failure','Expected or not significant'],
rows:[['Heart rate 48 and BP 86/50',0,'Two metoprolol doses plus diltiazem at 15 mg/hr produce bradycardia and hypotension.'],['Report limited to "stable, drip is running"',1,'A vague, unstructured report omits the rate change and current status.'],['Rate decrease ordered at 1530 never made on the pump',1,'The order change was not carried through or verified at transfer.'],['Irregularly irregular rhythm',2,'Expected with atrial fibrillation.'],['Cool skin and lightheadedness',0,'Signs of reduced perfusion from excess drug effect.']],
r:'Separating the physiologic problem (excess drug effect) from the system problem (handoff and order-verification failure) lets the nurse treat the patient now and address the process later.',
trap:'Some cues describe the patient; others describe the process. NGN matrix items often mix both.'},
{id:'c1_3',cs:'C1',mod:5,t:'mc',step:'PH',topic:'T9',concept:'Prioritizing the most immediate threat',
q:'Which problem is the nurse\'s priority at this time?',
o:[['Risk for falls related to orthostatic lightheadedness',0,'A real risk, but it results from the underlying hypoperfusion, which must be corrected first.'],['Decreased cardiac output from excessive diltiazem infusion',1,'Correct. Ongoing hypoperfusion from a drug still infusing at an unsafe rate is the most immediate physiologic threat.'],['Ineffective team communication between the ED and telemetry',0,'Contributed to the event, but it is a system issue to address after the patient is safe.'],['Knowledge deficit about new-onset atrial fibrillation',0,'Important for discharge, not a priority during instability.']],
r:'Use ABCs and "what will harm the patient first." Ongoing hypoperfusion from an infusion still running at three times the ordered rate outranks fall risk, teaching needs and system communication problems.',
trap:'Every option is a legitimate problem. The priority is the one causing harm right now.'},
{id:'c1_4',cs:'C1',mod:5,t:'mc',step:'TA',topic:'T9',concept:'Stop the source of harm before anything else',
q:'Which action should the nurse take first?',
o:[['Call the ED nurse to clarify why the infusion rate was not changed',0,'Investigating the cause can wait; harm is ongoing.'],['Place the patient flat and recheck the blood pressure in 5 minutes',0,'Supportive, but the infusion would keep running at an unsafe rate.'],['Stop the diltiazem infusion and remain with the patient',1,'Correct. Removing the source of harm is the first action; then notify the provider.'],['Notify the provider using SBAR and request new orders',0,'Essential and immediate — but after stopping the drug causing harm.']],
r:'When a medication is actively causing harm, the first action is to stop it (per protocol), stay with the patient and monitor. Provider notification follows immediately; investigation and reporting come after the patient is safe.',
trap:'"Notify the provider" is often right — but not when an action within nursing scope (stopping a harmful infusion) must happen first.'},
{id:'c1_5',cs:'C1',mod:6,t:'cloze',step:'GS',topic:'T10',concept:'SBAR Assessment and Recommendation',
q:'Complete the nurse\'s SBAR call by choosing from the lists of options.',
text:'Assessment: "I believe he is experiencing {0}." Recommendation: "I am requesting {1}."',
blanks:[[['symptomatic bradycardia and hypotension from excess diltiazem','hypovolemic hypotension from poor oral intake in the ED','a return of atrial fibrillation with rapid ventricular response'],0,'Findings (HR 48, BP 86/50, lightheadedness) after rate-control drugs point to excess drug effect.'],[['bedside evaluation now and orders for the infusion and blood pressure','a cardiology consult and a repeat 12-lead ECG in the morning','an order to recheck vital signs in 1 hour and call if worse'],0,'A strong Recommendation is specific, actionable and timely.']],
r:'SBAR Assessment states the nurse\'s clinical interpretation backed by data; the Recommendation requests a specific, actionable response. Counseling staff is not part of a clinical escalation call.',
trap:'"What do you want me to do?" and next-day consults are classic weak Recommendations.'},
{id:'c1_6',cs:'C1',mod:5,t:'mc',step:'EO',topic:'T7',concept:'Choosing data that match the QI aim',
q:'After a review finds 3 of the last 10 ED transfers arrived with infusion rates that did not match active orders, the unit adopts I-PASS with a joint bedside infusion check. Which finding best indicates that the change is effective?',
o:[['Staff surveys show nurses feel more confident giving report',0,'Perception data do not show whether the error rate changed.'],['Average phone report time decreases to under 60 seconds',0,'Faster is not safer; this could signal less thorough handoffs.'],['All telemetry nurses complete the I-PASS training module',0,'An activity measure — it shows training occurred, not that outcomes improved.'],['Transfers with infusion rates matching active orders rise to 98%',1,'Correct. A process measure that directly matches the problem being fixed.']],
r:'Evaluate a QI change with data that match the aim and compare with baseline (70% matching). Training counts and satisfaction surveys do not show whether the targeted failure decreased.',
trap:'Completion of training is the most tempting wrong answer — it measures effort, not results.'});

/* ---------------- CASE 2 ---------------- */
addCase('C2',2,'The 0300 Fall',[
['Nurses\' Notes','0305: Patient found on floor beside bed, lying on left side. States, "I was trying to get to the bathroom — I pushed the button forever." Alert and oriented ×3. Reports severe left hip pain. Left leg appears shortened and externally rotated. Bed alarm found turned off.'],
['History / MAR','82-year-old admitted 2 days ago with pneumonia. Morse Fall Scale 65 (high risk). Atrial fibrillation on apixaban 5 mg twice daily. Zolpidem 5 mg PO given at 2300 for sleep. Furosemide 40 mg PO given at 2100.'],
['Staffing','Night shift: 1 UAP for 14 patients after an unreplaced sick call. Bed alarm turned off at 2330 by the night nurse, who later states, "It false-alarms constantly — we all do it." No prior reports of false alarms on file.']]);

Q.push(
{id:'c2_1',cs:'C2',mod:5,t:'sata',step:'RC',topic:'T9',concept:'Recognizing high-risk cues after a fall',
q:'Which findings are most concerning to the nurse at 0305? Select all that apply.',
o:[['Left leg shortened and externally rotated',1,'Suggests hip fracture.'],['Alert and oriented ×3',0,'Reassuring; not an immediate concern.'],['Takes apixaban 5 mg twice daily',1,'Anticoagulation raises the risk of intracranial or hip bleeding after a fall.'],['Received zolpidem at 2300',1,'Sedative-hypnotics impair balance and can mask neurologic changes.'],['Admitting diagnosis of pneumonia',0,'Background; not an immediate post-fall cue.'],['Severe left hip pain',1,'Consistent with fracture; requires immobilization and evaluation.'],['States she was trying to reach the bathroom',0,'Explains the mechanism; useful for prevention, not an immediate safety cue.']],
r:'After a fall, priority cues are signs of serious injury (deformity, severe pain) and factors that increase the risk of hidden injury (anticoagulation — intracranial hemorrhage; sedation — altered neurologic assessment).',
trap:'"Alert and oriented" is reassuring now — but on an anticoagulant, a head bleed can declare itself later, so neuro checks continue.'},
{id:'c2_2',cs:'C2',mod:5,t:'mc',step:'TA',topic:'T9',concept:'Assess before moving after a fall',
q:'Which action should the nurse take first?',
o:[['Use a mechanical lift with two staff to return the patient to bed',0,'Moving a suspected hip fracture before assessment can worsen the injury.'],['Notify the provider immediately and request a portable x-ray of the left hip',0,'Necessary soon, but assessment comes first.'],['Assess neurologic status and the left leg before moving her',1,'Correct. Assess LOC, head injury signs and neurovascular status with the patient kept still.'],['Complete an incident report while her statements and the scene details are still fresh',0,'Reporting follows immediate patient care.']],
r:'Immediate patient safety comes first: keep the patient still, call for help, and perform a focused assessment (neurologic status — she is anticoagulated and sedated — plus neurovascular checks of the affected leg). Then notify the provider, move safely, document and report.',
trap:'"With a mechanical lift" makes moving sound safe — but moving a suspected fracture before assessment is still wrong.'},
{id:'c2_3',cs:'C2',mod:5,t:'matrix',step:'GS',topic:'T2',concept:'Medical record vs incident report',
q:'For each statement, indicate where it belongs.',
cols:['Medical record (may also appear in report)','Incident report only','Neither document'],
rows:[['"Left leg shortened and externally rotated; pain 8/10."',0,'Objective assessment belongs in the chart.'],['"Patient stated, \'I pushed the button forever.\'"',0,'A direct quote is objective and belongs in the chart.'],['Names of the staff who witnessed the scene',1,'Witness information is part of the incident report.'],['"Incident report completed and sent to risk management."',2,'Never chart that a report was filed; the report itself does not record its own filing.'],['"Fall occurred because the unit was understaffed."',2,'Speculation and blame belong in neither document.']],
r:'The chart contains objective findings, quotes, notifications, interventions and responses. The incident report adds witnesses and the factual timeline. Neither contains blame, speculation, or a chart note that a report was filed.',
trap:'A patient\'s quote that implies a delay is still objective. Your conclusion about the cause is not.'},
{id:'c2_4',cs:'C2',mod:5,t:'mc',step:'AC',topic:'T6',concept:'RCA: multiple validated system causes',
q:'The RCA team presents four conclusions. Which conclusion reflects a properly conducted root cause analysis?',
o:[['The UAP did not answer the call light, so the UAP should complete retraining',0,'Stops at an individual and ignores why one UAP covered 14 patients.'],['The patient did not wait for assistance despite being told to call for help',0,'Blames the patient and ignores sedation, diuretic timing and system factors.'],['The night nurse disabled the bed alarm, and that decision was the single cause of this fall',0,'A single-cause, individual conclusion — a classic RCA mistake.'],['Sedation timing, a disabled alarm and an unreplaced sick call each contributed',1,'Correct. Multiple validated system contributors, each needing a countermeasure.']],
r:'Common RCA mistakes include stopping at a person and focusing on only one root cause. A strong RCA identifies several validated contributors (medication timing, alarm practices, staffing replacement process) and develops a countermeasure for each.',
trap:'Watch for "single cause." Complex events almost never have one.'},
{id:'c2_5',cs:'C2',mod:5,t:'mc',step:'PH',topic:'T3',concept:'Just Culture: at-risk behavior',
q:'Based on the night nurse\'s statement about the bed alarm, which classification and response best reflect Just Culture?',
o:[['Human error — console the nurse and retrain all night-shift staff on correct bed-alarm use',0,'Disabling the alarm was a deliberate choice, not a slip or lapse.'],['Reckless behavior — the nurse knowingly disabled a safety device, so begin progressive discipline',0,'Reckless requires conscious disregard of a known, substantial risk; here the risk was normalized and underestimated.'],['At-risk behavior — coach the nurse and examine the false-alarm problem',1,'Correct. A normalized shortcut ("we all do it") is at-risk behavior: coach and remove the incentive.'],['No individual accountability — staffing was the real root cause',0,'Just Culture still holds people accountable for their behavioral choices.']],
r:'At-risk behavior is a choice whose risk is not recognized or seems justified, often because the shortcut has become normal. The response is coaching plus fixing what makes the shortcut attractive (false alarms, settings) and encouraging reporting of the problem.',
trap:'"We all do it" signals normalized deviance — at-risk behavior → COACH, not punish.'},
{id:'c2_6',cs:'C2',mod:5,t:'sata',step:'EO',topic:'T7',concept:'Evaluating countermeasures with the right data',
q:'Three months after implementing a sick-call replacement process, alarm-sensitivity adjustments and sedative review for high-fall-risk patients, which findings indicate the countermeasures are working? Select all that apply.',
o:[['Falls with injury per 1,000 patient-days decreased from baseline',1,'Outcome measure matched to the aim.'],['Fall-related incident reports decreased to zero',0,'Could reflect underreporting; fewer reports is not proof of fewer falls.'],['Audits show bed alarms active for 96% of high-risk patients',1,'Process measure showing the countermeasure is being used.'],['All staff completed the fall-prevention module',0,'Activity measure, not an outcome.'],['Sedative-hypnotic orders for high-fall-risk older adults decreased',1,'Process measure tied to a validated root cause.'],['The manager reports improved morale on night shift',0,'Not a measure of fall prevention.']],
r:'Evaluate with outcome and process measures that match the aim and compare with baseline. A sudden drop to zero reports can mean events are not being reported, which is a safety-culture warning sign.',
trap:'"Zero incident reports" sounds like success — in a Just Culture it may signal that people stopped reporting.'});

/* ---------------- CASE 3 ---------------- */
addCase('C3',3,'The Insulin Problem on 5 East',[
['Event Summary',[['Event type (last 3 months)','Count'],['Rapid-acting insulin given >60 min after tray arrival','6'],['Insulin given without a documented pre-meal glucose','3'],['Wrong dose from misreading the sliding scale','2']]],
['Staff Interviews','"Trays show up at random times and nobody tells us." · "We have one glucometer for 28 patients." · "The rapid-acting and long-acting pens look almost the same and share a bin." · "On the workstation-on-wheels screen, the sliding-scale table gets cut off."'],
['Unit Data','Median tray-to-insulin time (baseline): 58 minutes. Target set by diabetes educator: ≤ 30 minutes.']]);

Q.push(
{id:'c3_1',cs:'C3',mod:5,t:'sata',step:'RC',topic:'T5',concept:'Identifying latent conditions',
q:'Which findings represent latent conditions? Select all that apply.',
o:[['Look-alike insulin pens stored in a shared bin',1,'Storage/design condition that sets nurses up to fail.'],['A nurse misread the scale and gave 8 units instead of 4',0,'An unsafe act at the point of care — an active failure.'],['Meal trays arrive without notification to nurses',1,'Upstream workflow condition.'],['One glucometer for 28 patients',1,'Equipment/resource condition.'],['A nurse gave insulin without checking a glucose',0,'Active failure, even though a latent shortage contributed.'],['The sliding-scale table is truncated on the screen',1,'Interface design flaw.'],['Six doses were given late',0,'This is the outcome being analyzed, not a condition causing it.']],
r:'Latent conditions are hidden system weaknesses (design, equipment, workflow, staffing) that make active failures more likely. Classify the act itself: a misread is active even when a latent screen problem set it up.',
trap:'Results ("doses were late") are neither active nor latent — they are the outcome under study.'},
{id:'c3_2',cs:'C3',mod:5,t:'mc',step:'AC',topic:'T7',concept:'Choosing QI tools in sequence',
q:'The team wants to determine which event type to target first and then explore everything contributing to it. Which approach is most appropriate?',
o:[['Fishbone diagram of all 11 events, followed by 5 Whys on each event',0,'Analyzes everything at once instead of focusing on the biggest problem.'],['Run chart of monthly events, followed by a flowchart of the insulin process',0,'A run chart shows change over time; it does not rank categories.'],['Pareto chart of event types, followed by a fishbone on the top category',1,'Correct. Pareto ranks the categories; fishbone organizes causes of the largest one.'],['Flowchart of medication administration, followed by a Pareto of root causes',0,'Root causes are not yet known, so they cannot be ranked.']],
r:'A Pareto chart identifies the "vital few" (timing errors: 6 of 11). A fishbone then organizes that problem\'s causes into categories, often followed by 5 Whys on selected branches.',
trap:'Pareto answers WHICH problem; fishbone answers WHY.'},
{id:'c3_3',cs:'C3',mod:5,t:'cloze',step:'PH',topic:'T7',concept:'Writing a strong aim statement',
q:'Complete the team\'s aim statement by choosing from the lists of options.',
text:'"Reduce {0} on 5 East {1}."',
blanks:[[['median tray-to-insulin time from 58 to 30 minutes or less','insulin timing errors as much as possible across all shifts','the delay between meal trays and insulin significantly'],0,'Specific and measurable, and matched to the largest problem.'],[['within 8 weeks','through staff education on insulin timing','whenever staffing levels allow'],0,'Time-bound.']],
r:'A strong aim is specific, measurable and time-bound, and it targets the problem the data identified.',
trap:'"As much as possible" and "be careful" are not measurable.'},
{id:'c3_4',cs:'C3',mod:5,t:'mc',step:'GS',topic:'T7',concept:'Designing a small test of change',
q:'Which is the most appropriate first test of change?',
o:[['Implement a hospital-wide insulin timing policy, with audits, beginning on the first of next month',0,'Large and untested — contrary to PDSA.'],['Have dietary page the assigned nurse when trays leave the kitchen for one hallway for one week',1,'Correct. Small, rapid, targeted at a cause, and measurable.'],['Require every 5 East nurse to complete an insulin timing module and pass a competency quiz this month',0,'Education does not address the notification gap causing the delays.'],['Begin progressive discipline for nurses with two or more late doses',0,'Punitive response to a system problem.']],
r:'PDSA starts with a small-scale test on one hallway or shift with a prediction and data collection, then studies results before spreading.',
trap:'"Hospital-wide" or "policy" in a first PDSA test is a red flag.'},
{id:'c3_5',cs:'C3',mod:5,t:'matrix',step:'TA',topic:'T7',concept:'PDSA phases',
q:'For each activity, indicate the PDSA phase.',
cols:['Plan','Do','Study','Act'],
rows:[['Predict that median tray-to-insulin time will fall below 30 minutes',0,'Writing the prediction is part of Plan.'],['Decide which hallway, who records times and how data are collected',0,'Logistics and data plan are Plan.'],['Dietary pages nurses on one hallway for one week',1,'Running the small test is Do.'],['Compare the median time with the prediction and review missed pages',2,'Comparing results with the prediction is Study.'],['Switch from phone calls to automatic pages and test on a second hallway',3,'Adopt/adapt/abandon and start the next cycle is Act.']],
r:'Plan = change, prediction, who/when, data. Do = run the test and collect data. Study = compare with the prediction and learn. Act = adopt, adapt or abandon, then start another cycle.',
trap:'Deciding HOW to collect data is Plan, not Do.'},
{id:'c3_6',cs:'C3',mod:5,t:'mc',step:'EO',topic:'T7',concept:'Interpreting PDSA results and next steps',
q:'After one week, the median tray-to-insulin time on the test hallway fell from 58 to 22 minutes, but two evening doses were late when dietary staff forgot to page. What should the team do next?',
o:[['Spread the current process to every unit because the median improved',0,'Spreading before fixing the known failure point skips another learning cycle.'],['Abandon the change because the results were not perfect',0,'The change clearly helped; PDSA expects iteration.'],['Adapt the process, such as an automatic page, and run another test cycle',1,'Correct. Act = adopt, adapt or abandon; here adapt and retest.'],['Report the dietary staff members who forgot to page to their supervisor',0,'Blames individuals for a reliance-on-memory design weakness.']],
r:'PDSA is iterative. Positive results with a known weakness call for adapting the change (reducing reliance on memory) and testing again before spreading.',
trap:'"Forgot" again points to a design that relies on memory — fix the design.'});

/* ---------------- CASE 4 ---------------- */
addCase('C4',4,'The Wrong Knee',[
['Event Summary','A patient scheduled for LEFT knee arthroscopy has the procedure performed on the RIGHT knee and requires a second operation.'],
['Review Findings','• The OR scheduling system lets staff book a procedure without entering laterality.\n• The consent, generated from the schedule, reads only "knee arthroscopy."\n• The site mark was made with a pen that washed off during chlorhexidine prep.\n• The patient speaks Mandarin; her 16-year-old grandson interpreted for consent.\n• The surgeon was 2 hours behind and the time-out was abbreviated.\n• The circulating nurse was floated from another OR suite and was unfamiliar with its checklist. She later says, "I noticed there was no mark, but it wasn\'t my place to stop him — he was already behind."']]);

Q.push(
{id:'c4_1',cs:'C4',mod:5,t:'mc',step:'AC',topic:'T1',concept:'Never event and sentinel event',
q:'How should the quality department classify this event?',
o:[['Adverse event; formal investigation is optional because the harm was temporary',0,'Wrong-site surgery requires immediate investigation regardless of recovery.'],['Medical negligence attributable to the surgeon who performed the procedure',0,'Multiple system failures aligned; single-person attribution blocks learning.'],['Never event that also meets sentinel-event criteria requiring an RCA',1,'Correct. Clearly identifiable, preventable and serious; requires immediate investigation.'],['Near miss, because the correct knee was eventually repaired',0,'The error reached and harmed the patient.']],
r:'Wrong-site surgery is a classic never event and a sentinel event: an unexpected occurrence involving serious harm that requires immediate investigation and root cause analysis.',
trap:'Later repair does not undo the harm. If it reached the patient, it is not a near miss.'},
{id:'c4_2',cs:'C4',mod:5,t:'matrix',step:'AC',topic:'T5',concept:'Active vs latent failures',
q:'For each finding, indicate whether it is an active failure or a latent condition.',
cols:['Active failure','Latent condition'],
rows:[['Scheduling system permits booking without laterality',1,'A design flaw upstream of the bedside.'],['Site-marking pen is not resistant to chlorhexidine prep',1,'An equipment/material weakness.'],['Surgeon begins the incision after an abbreviated time-out',0,'An unsafe act at the sharp end.'],['Floated nurse was not oriented to the suite\'s checklist',1,'A staffing/training condition.'],['Circulating nurse proceeds without confirming the site against the consent',0,'An unsafe act at the point of care.']],
r:'Active failures are unsafe acts at the sharp end; latent conditions are upstream weaknesses in design, equipment, staffing and training. Swiss Cheese: harm occurred when both lined up.',
trap:'The farther a failure is from the bedside, the more latent it is.'},
{id:'c4_3',cs:'C4',mod:6,t:'mc',step:'PH',topic:'T13',concept:'Authority gradient',
q:'Which communication barrier most directly explains the circulating nurse\'s silence?',
o:[['Filtration of information during a busy case',0,'She noticed the missing mark — the information was not screened out.'],['Authority gradient between the nurse and the surgeon',1,'Correct. She recognized the hazard but did not feel able to challenge a higher-status clinician.'],['Role ambiguity because she was floated from another suite',0,'Unfamiliarity contributed, but verifying the site is clearly within her role.'],['Use of jargon on the surgical consent',0,'The consent problem was missing laterality, not jargon.']],
r:'An authority gradient discourages lower-status team members from speaking up. Her words — "it wasn\'t my place to stop him" — signal hierarchy, not missing knowledge.',
trap:'If the person KNEW and stayed silent, think hierarchy/psychological safety, not filtration.'},
{id:'c4_4',cs:'C4',mod:5,t:'sata',step:'GS',topic:'T6',concept:'Countermeasures for failed barriers',
q:'Which countermeasures would strengthen the barriers that failed? Select all that apply.',
o:[['Make laterality a required field that blocks scheduling and consent until completed',1,'A forcing function that closes the upstream gap.'],['Send a memo reminding surgeons to slow down when they are behind schedule',0,'A weak, vigilance-based fix.'],['Use a site marker validated to remain visible after skin prep',1,'Fixes the equipment weakness.'],['Require a qualified medical interpreter for informed consent',1,'Closes the language barrier in consent verification.'],['Suspend the circulating nurse pending retraining',0,'Punitive and individual; it fixes no barrier.'],['Standardize the time-out so incision cannot begin until every member confirms the site',1,'Standardizes the process and counters hierarchy.']],
r:'Each Swiss Cheese layer that failed needs its own system-level countermeasure. Forcing functions and standardization are stronger than reminders or discipline.',
trap:'Match each failed layer to a design fix. Memos and suspensions don\'t plug holes.'},
{id:'c4_5',cs:'C4',mod:6,t:'mc',step:'TA',topic:'T10',concept:'CUS to stop the line',
q:'Months later, during a time-out, a nurse notices that the consent lists the left knee but the surgeon is prepping the right. Which statement by the nurse is most appropriate?',
o:[['"Doctor, before we go any further today, are you completely sure that we have the correct knee prepped?"',0,'Too tentative; it invites a quick "yes" and does not stop the action.'],['"I\'m concerned the consent says left. I\'m uncomfortable. This is a safety issue — we need to stop."',1,'Correct. CUS escalates clearly and signals stop-the-line.'],['"I will document the discrepancy in my notes and make sure we bring it up at the debrief afterward."',0,'Delays action until after harm.'],['"Let\'s finish prepping the right side, and I\'ll recheck the consent and the schedule before the incision."',0,'Allows the unsafe action to continue.']],
r:'CUS ("I am Concerned, I am Uncomfortable, this is a Safety issue") is a stop-the-line tool for imminent danger. Hedged questions and after-the-fact debriefs do not protect the patient.',
trap:'Politeness is not the priority when harm is imminent — clarity is.'},
{id:'c4_6',cs:'C4',mod:5,t:'mc',step:'TA',topic:'T4',concept:'Transparency and disclosure',
q:'Which approach to informing the patient about the error is most consistent with course principles?',
o:[['Wait until the RCA is finished so the explanation is complete',0,'Disclosure should be timely; waiting withholds information the patient needs.'],['Provide a timely, factual and compassionate disclosure coordinated per policy',1,'Correct. Transparency requires timely, factual, compassionate, coordinated disclosure.'],['Have the circulating nurse apologize privately on behalf of the team',0,'Disclosure should be coordinated per policy, not informal and individual.'],['Disclose the error only if the patient or family asks what happened',0,'Transparency is proactive, not conditional.']],
r:'Transparency means communicating openly with patients and families about adverse events. Disclosure should be timely, factual, compassionate and coordinated according to organizational policy.',
trap:'"Wait until we have all the facts" sounds responsible but violates timely disclosure.'});

/* ---------------- CASE 5 ---------------- */
addCase('C5',5,'"It\'s Just Pain"',[
['Vital Signs',[['Time','HR','BP','RR','Temp','SpO2'],['0800','84','128/76','16','37.0 °C','97% RA'],['1500','102','110/66','20','37.9 °C','96% RA'],['1900','118','92/58','24','38.6 °C','94% RA']]],
['Nurses\' Notes','67-year-old, post-op day 1 after bowel resection. 1900: Newly confused — asks the nurse what year it is twice. Urine output 15 mL/hr for the past 2 hours. Abdominal pain 6/10 on PCA. Incision well approximated. Bowel sounds hypoactive.'],
['Provider Call Log','1910: Surgical resident: "It\'s pain. Give his PRN and recheck in the morning." 1925: Nurse restates concern. Resident: "I already told you," and ends the call. 1935: BP 86/54.']]);

Q.push(
{id:'c5_1',cs:'C5',mod:5,t:'sata',step:'RC',topic:'T9',concept:'Recognizing deterioration (failure to rescue)',
q:'Which findings at 1900 require immediate follow-up? Select all that apply.',
o:[['Heart rate increase from 84 to 118',1,'A progressive trend over the shift.'],['Hypoactive bowel sounds',0,'Expected on post-op day 1 after bowel surgery.'],['Blood pressure 92/58 from a baseline of 128/76',1,'Falling blood pressure suggests hypoperfusion.'],['New confusion',1,'Altered mental status is an early sign of sepsis and hypoperfusion.'],['Incision well approximated',0,'A reassuring finding.'],['Urine output 15 mL/hr for 2 hours',1,'Oliguria signals decreased renal perfusion.'],['Pain 6/10 with a PCA in place',0,'Needs reassessment but does not explain the cluster.']],
r:'Trending vital signs over the shift reveal progressive deterioration: tachycardia, hypotension, fever, new confusion and oliguria. Recognizing and escalating these cues prevents failure to rescue.',
trap:'Each 1500 value looked "only a little off." The trend is the cue.'},
{id:'c5_2',cs:'C5',mod:5,t:'mc',step:'PH',topic:'T9',concept:'Prioritizing the most likely and dangerous hypothesis',
q:'Which hypothesis should the nurse prioritize?',
o:[['Inadequately controlled postoperative pain',0,'Pain does not explain fever, confusion, hypotension and oliguria together.'],['Hypovolemia related to NPO status and surgical losses',0,'Could explain tachycardia and hypotension, but not fever.'],['Postoperative delirium related to opioid use',0,'Does not account for fever, hypotension or oliguria.'],['Sepsis with signs of worsening hypoperfusion',1,'Correct. Fever, tachycardia, hypotension, confusion and oliguria together point to sepsis.']],
r:'The cluster of fever, tachycardia, tachypnea, hypotension, new confusion and oliguria best fits sepsis with hypoperfusion — the most dangerous and most likely explanation, requiring urgent escalation.',
trap:'Choose the hypothesis that explains ALL the cues, not just some of them.'},
{id:'c5_3',cs:'C5',mod:6,t:'cloze',step:'GS',topic:'T10',concept:'SBAR Assessment supported by data',
q:'Complete the Assessment portion of the nurse\'s SBAR by choosing from the lists of options.',
text:'"I am concerned he may have {0}, based on {1}."',
blanks:[[['sepsis','uncontrolled incisional pain','opioid oversedation'],0,'The interpretation that fits all findings.'],[['new fever, hypotension, tachycardia, confusion and low urine output','his pain score of 6/10 and hypoactive bowel sounds on the PCA','his age, recent bowel surgery and current PCA opioid use'],0,'The objective data that support the concern.']],
r:'SBAR Assessment states the nurse\'s interpretation and supports it with objective data. Anchoring on pain ignores the cue cluster.',
trap:'A convenient explanation (pain) is the trap the resident fell into.'},
{id:'c5_4',cs:'C5',mod:6,t:'mc',step:'TA',topic:'T10',concept:'Two-Challenge Rule → chain of command',
q:'At 1935, after the resident has dismissed the concern twice, which action should the nurse take?',
o:[['Give the PRN analgesic as directed and reassess in 30 minutes',0,'Following an order that ignores worsening hypotension places the patient at risk.'],['Call the resident a third time and state the concern using CUS',0,'Two challenges have failed and danger persists — it is time for stronger action.'],['Activate the rapid response team and notify the charge nurse',1,'Correct. Escalate through the chain of command when danger persists.'],['Document the resident\'s refusal and increase vital signs to every hour',0,'Documentation and monitoring do not address the deterioration.']],
r:'Two-Challenge Rule: state the concern, then assertively restate it. If it remains unresolved and danger persists, take stronger action — rapid response and chain of command.',
trap:'A third call to the same person sounds persistent, but the rule says escalate after two.'},
{id:'c5_5',cs:'C5',mod:6,t:'matrix',step:'GS',topic:'T12',concept:'Matching the communication tool to the moment',
q:'For each situation, indicate the most appropriate tool.',
cols:['Two-Challenge Rule','CUS','DESC','Debrief'],
rows:[['Restating the safety concern after it was ignored the first time',0,'The second assertive statement of a concern.'],['"I am concerned, I am uncomfortable — this is a safety issue."',1,'The CUS escalation phrases.'],['A private conversation with the resident the next day about the dismissive call',2,'Structured, constructive conflict resolution.'],['The team reviews what went well and what to change after the ICU transfer',3,'Learning after the event.']],
r:'CUS and the Two-Challenge Rule are safety escalation tools used now; DESC resolves interpersonal conflict later; a debrief reviews team performance after the event.',
trap:'DESC is never the answer while the patient is still in danger.'},
{id:'c5_6',cs:'C5',mod:5,t:'sata',step:'EO',topic:'T3',concept:'Follow-up that supports a culture of safety',
q:'Mr. Tran is transferred to the ICU with septic shock. Which follow-up actions support learning and a culture of safety? Select all that apply.',
o:[['Submit a safety report about the delayed escalation',1,'Allows system analysis of escalation barriers.'],['Participate in a debrief on communication and escalation',1,'Turns the event into team learning.'],['Warn other nurses about the resident in the unit group chat',0,'Unprofessional and escalates conflict; may breach privacy.'],['Use DESC in a private conversation with the resident',1,'Constructive conflict resolution.'],['Avoid paging that resident on future shifts',0,'Avoidance is not a fix and could delay care.'],['Chart that the resident refused to evaluate the patient',0,'The chart records objective facts and notifications, not blame.']],
r:'Reporting, debriefing and constructive conflict resolution strengthen psychological safety and system learning. Gossip, avoidance and blaming documentation undermine them.',
trap:'The chart records times and content of notifications — not judgments about colleagues.'});

/* ===== NGN CASE STUDIES 6–10 ===== */

/* ---------------- CASE 6 ---------------- */
addCase('C6',6,'Discharge Day for Mrs. Pham',[
['Nurses\' Notes','71-year-old admitted with a heart failure exacerbation; ready for discharge today. Primary language Vietnamese; limited English proficiency. Lives alone; does not drive. Adult son speaks English, works days, and offers to "translate everything" during discharge teaching. Lungs clear; weight down 2.5 kg since admission.'],
['Discharge Orders','• NEW: metoprolol succinate 25 mg PO daily\n• CHANGED: furosemide 40 mg PO daily (was 20 mg as needed)\n• Daily weights; call for gain of more than 1 kg in a day or 2 kg in a week\n• 2 g sodium diet\n• Cardiology follow-up within 7 days']]);

Q.push(
{id:'c6_1',cs:'C6',mod:6,t:'sata',step:'RC',topic:'T14',concept:'Recognizing transition-of-care risks',
q:'Which findings increase Mrs. Pham\'s risk for an unsafe care transition? Select all that apply.',
o:[['Limited English proficiency',1,'Language barrier threatens understanding of complex teaching.'],['Weight down 2.5 kg since admission',0,'Expected result of diuresis; not a transition risk.'],['One new and one changed medication',1,'Medication changes are a leading source of post-discharge error.'],['Lives alone and does not drive',1,'Barriers to follow-up and support at home.'],['Lungs clear on auscultation',0,'Reassuring clinical finding.'],['Son offers to interpret the discharge teaching',1,'Family interpretation risks omissions and inaccuracy for complex teaching.'],['Cardiology follow-up ordered within 7 days',0,'Appropriate plan; the risk is getting there, not the order itself.']],
r:'Language barriers, multiple medication changes, living alone without transportation and reliance on family interpretation all increase the risk of misunderstanding, nonadherence and readmission.',
trap:'A family member\'s willingness to help can itself be a risk cue when accuracy matters.'},
{id:'c6_2',cs:'C6',mod:6,t:'mc',step:'AC',topic:'T14',concept:'Why family should not replace a qualified interpreter',
q:'The son insists, "I can translate — it\'s faster." Which response by the nurse best reflects the rationale for using a qualified interpreter?',
o:[['"Family members are not legally allowed to interpret in a hospital."',0,'Overstated absolute; the issue is accuracy and safety, not a universal legal ban.'],['"You work during the day, so she needs to learn the medication changes herself, without you."',0,'True but not the reason a qualified interpreter is needed.'],['"Trained interpreters convey complex information completely and accurately."',1,'Correct. Accuracy, completeness and privacy are the reasons.'],['"Patients always prefer a professional over a relative to interpret sensitive health information."',0,'Overgeneralization; preferences vary.']],
r:'Family interpreters may omit, simplify or alter clinical information and can compromise privacy. Qualified interpreters support accurate, complete communication for complex teaching.',
trap:'Watch for absolute words ("always," "never," "not allowed") in distractors.'},
{id:'c6_3',cs:'C6',mod:6,t:'mc',step:'TA',topic:'T14',concept:'Working with an interpreter',
q:'Which action by the nurse during interpreted discharge teaching is most appropriate?',
o:[['Facing the interpreter and saying, "Tell her to weigh herself every morning"',0,'Speak directly to the patient, not about her in the third person.'],['Asking the interpreter to summarize the key teaching points for Mrs. Pham in her own words',0,'Summaries risk omissions; interpret statements completely.'],['Speaking directly to Mrs. Pham in short segments and pausing for interpretation',1,'Correct. Speak to the patient in first person, in short chunks.'],['Speaking slowly and loudly so Mrs. Pham can follow some English',0,'Volume does not overcome a language barrier and can be disrespectful.']],
r:'With an interpreter, speak directly to the patient, use plain language in short segments, pause for interpretation, and confirm understanding with teach-back.',
trap:'The interpreter is a conduit; the conversation is with the patient.'},
{id:'c6_4',cs:'C6',mod:6,t:'mc',step:'EO',topic:'T11',concept:'Teach-back reveals a misunderstanding',
q:'Through the interpreter, Mrs. Pham explains, "I take the water pill when my ankles get puffy." Which action should the nurse take next?',
o:[['Repeat the same explanation more slowly through the interpreter',0,'Repeating an approach that did not work is unlikely to succeed.'],['Ask her son to remind her to take the water pill each morning',0,'Bypasses the patient and does not confirm her understanding.'],['Re-teach the daily schedule using a pill calendar, then repeat teach-back',1,'Correct. Re-teach a different way and confirm again.'],['Document that teaching was completed with partial understanding',0,'Unsafe; she misunderstands a key medication change.']],
r:'Teach-back evaluates the teaching. When it reveals a misunderstanding, re-teach using a different approach and repeat teach-back until understanding is confirmed.',
trap:'A failed teach-back means the teaching failed — not the patient.'},
{id:'c6_5',cs:'C6',mod:6,t:'cloze',step:'GS',topic:'T15',concept:'Shared decision-making (SHARE)',
q:'Mrs. Pham says, "I don\'t have a scale, and weighing every day seems pointless." Complete the sentence by choosing from the lists of options.',
text:'The nurse should first {0}, and then {1}.',
blanks:[[['ask what matters most to her in managing her heart failure at home','explain why daily weights are required for heart failure','teach her how daily weights help prevent readmission'],0,'SHARE begins by seeking participation and assessing values.'],[['work with case management to obtain a scale and agree on a plan together','ask the provider to change her to weekly weights in clinic','have her son weigh her once a week on the weekend'],0,'Reach a decision together and solve the barrier collaboratively.']],
r:'Shared decision-making seeks participation, explores options, assesses values and preferences, reaches a decision together and evaluates it. Resource barriers are solved collaboratively rather than labeled as refusal.',
trap:'SDM decides WITH the patient — never FOR her, and never just labels her "noncompliant."'},
{id:'c6_6',cs:'C6',mod:6,t:'sata',step:'GS',topic:'T14',concept:'Safe discharge plan for limited English proficiency',
q:'Which interventions should the nurse include in Mrs. Pham\'s discharge plan? Select all that apply.',
o:[['Plain-language written instructions in Vietnamese',1,'Accessible reinforcement of verbal teaching.'],['Teach-back through the interpreter for each medication change',1,'Confirms understanding of each change.'],['English-only handout for her son to review in the evening',0,'Not accessible to the patient; shifts responsibility to the son.'],['Case-management referral for transportation to cardiology follow-up',1,'Addresses a key transition barrier.'],['Telephone interpreter for the post-discharge follow-up call',1,'Maintains accurate communication after discharge.'],['A detailed 10-page heart failure booklet to read at home',0,'Too long for limited health literacy; does not confirm understanding.']],
r:'Safe transitions combine qualified interpretation, plain-language materials in the patient\'s language, teach-back, and coordination of follow-up and transportation.',
trap:'"More information" (a long booklet) is not better teaching.'});

/* ---------------- CASE 7 ---------------- */
addCase('C7',7,'The Pump Shortage',[
['Nurses\' Notes','ICU night shift; every infusion pump is in use. A new-graduate nurse on orientation hangs potassium chloride 20 mEq/100 mL on gravity tubing for a patient with a potassium of 3.1 mEq/L. An experienced nurse passing the room notices, clamps the tubing before the infusion starts, and helps her obtain a pump from central supply. The patient receives no potassium by gravity.'],
['Follow-up','The new graduate says, "Please don\'t report this — nothing happened, and I\'m still on orientation." Unit policy requires all IV potassium to be given by infusion pump. Pump shortages have been mentioned informally at staff meetings twice this quarter.']]);

Q.push(
{id:'c7_1',cs:'C7',mod:5,t:'mc',step:'RC',topic:'T1',concept:'Near miss',
q:'How should the nurse classify this event?',
o:[['Medical error that reached the patient without harm',0,'The potassium never infused — it did not reach the patient.'],['Adverse event, because a high-alert drug was involved',0,'No injury from care occurred.'],['Near miss that should be reported per policy',1,'Correct. Intercepted before reaching the patient; still reportable.'],['Not reportable, because no medication was given',0,'Near misses are valuable safety data and should be reported.']],
r:'A near miss is an event that could have caused harm but did not reach the patient. Near misses expose weak barriers and must be reported.',
trap:'"Nothing happened" is exactly why near misses are valuable — the system learns without anyone being hurt.'},
{id:'c7_2',cs:'C7',mod:6,t:'mc',step:'AC',topic:'T12',concept:'Cross-monitoring',
q:'Later, the new graduate asks the experienced nurse why she stepped in instead of "letting me learn from it." Which response by the experienced nurse best reflects TeamSTEPPS principles?',
o:[['"On a good team we watch each other\'s actions, so errors get caught before they reach the patient."',1,'Correct. Cross-monitoring catches mistakes before they cause harm; it is not about blame.'],['"Nurses on orientation should never hang high-alert medications unless a preceptor is present."',0,'Shifts to a rule about her status instead of the team strategy.'],['"I stepped in so that this wouldn\'t become a near miss that has to be reported to the manager."',0,'Catching an error does not remove the need to report it.'],['"I would have let you continue if the potassium had been ordered at a lower concentration."',0,'IV potassium on gravity tubing is unsafe at any concentration.']],
r:'Cross-monitoring ("watching each other\'s back") catches mistakes and oversights before they reach the patient. Helping obtain the pump afterward is task assistance.',
trap:'Learning from an error never requires letting it reach the patient.'},
{id:'c7_3',cs:'C7',mod:5,t:'mc',step:'TA',topic:'T2',concept:'Reporting a near miss within Just Culture',
q:'Which response by the experienced nurse to the new graduate\'s request is most appropriate?',
o:[['"Since the potassium never reached the patient, there\'s nothing here that needs to be reported."',0,'Near misses must be reported per policy.'],['"I\'ll add a note to the patient\'s chart that the error was caught in time."',0,'Incident details and reports do not belong in the medical record.'],['"Reporting this helps fix the pump shortage — it\'s about the system, not punishing you."',1,'Correct. Report the near miss and reinforce Just Culture.'],['"I\'ll tell the manager what happened and let her decide whether you need to be written up for this."',0,'Frames reporting as punishment and discourages future reporting.']],
r:'Near misses should be reported through the safety system. Just Culture makes reporting safe by focusing on system learning rather than automatic punishment.',
trap:'Reassurance belongs with the report, not instead of it.'},
{id:'c7_4',cs:'C7',mod:5,t:'matrix',step:'PH',topic:'T3',concept:'Classifying behavior under Just Culture',
q:'For each scenario, indicate the Just Culture classification.',
cols:['Human error','At-risk behavior','Reckless behavior'],
rows:[['A nurse selects the wrong concentration from an adjacent look-alike bin',0,'An unintentional slip.'],['A nurse routinely hangs IV potassium by gravity when pumps are scarce because "everyone does it"',1,'A normalized shortcut whose risk is underestimated.'],['After a colleague warns her it is prohibited and dangerous, a nurse hangs IV potassium by gravity because she "doesn\'t have time"',2,'Conscious disregard of a known, substantial risk.'],['A nurse forgets to unclamp a secondary line during a busy admission',0,'An unintentional lapse.']],
r:'Classify the behavior, not the outcome: unintentional slips/lapses are human error (console); normalized risky choices are at-risk (coach); knowingly disregarding substantial risk is reckless (discipline may be appropriate).',
trap:'The difference between at-risk and reckless is whether the person recognized the risk and chose it anyway.'},
{id:'c7_5',cs:'C7',mod:5,t:'sata',step:'GS',topic:'T6',concept:'System countermeasures',
q:'Which countermeasures address the system conditions behind this near miss? Select all that apply.',
o:[['Establish infusion-pump par levels with real-time tracking',1,'Addresses the latent pump shortage.'],['Create an escalation pathway for nurses when no pump is available',1,'Gives staff a safe alternative to workarounds.'],['Have pharmacy dispense IV potassium with a "pump required" label and barcode check',1,'Builds a barrier into the medication system.'],['Email staff reminding them that potassium must be on a pump',0,'A weak reminder that relies on memory.'],['Remove the new graduate from IV medication administration',0,'Punitive and leaves the shortage unaddressed.'],['Stop ordering IV potassium in the ICU',0,'Unsafe and clinically inappropriate.']],
r:'Strong countermeasures target the latent conditions (equipment availability, escalation options, labeling and verification) rather than relying on reminders or removing individuals.',
trap:'Removing the person who made the slip leaves the hole in the cheese.'},
{id:'c7_6',cs:'C7',mod:5,t:'mc',step:'EO',topic:'T4',concept:'HRO: preoccupation with failure',
q:'The near miss is reported. Which response by the nurse manager best reflects high-reliability practice?',
o:[['"The system worked because the error was caught, so no further action is needed on this one."',0,'Treats a near miss as proof that the defenses work.'],['"I\'ll remind all staff at the next meeting that IV potassium must always run on a pump."',0,'A reminder does not fix the pump shortage that set up the error.'],['"This shows the pump supply is a weak barrier — let\'s fix the shortage before someone is harmed."',1,'Correct. Preoccupation with failure treats near misses as early warnings.'],['"The new graduate should repeat the IV-medication module before she finishes orientation."',0,'Individual remediation ignores the latent condition.']],
r:'Preoccupation with failure means treating near misses and small failures as warnings about weak defenses rather than as proof the system works.',
trap:'"Nothing happened" is the start of the analysis, not the end.'});

/* ---------------- CASE 8 ---------------- */
addCase('C8',8,'Transfers at Shift Change',[
['Situation','ED nurses send admitted patients to 4 West between 1845 and 1930, during bedside shift report. 4 West nurses have begun refusing all transfers during that window. Two transfers last week arrived with incomplete medication information.'],
['Overheard','ED charge nurse: "Your unit always complains, so nobody takes your concerns seriously." · 4 West nurse to the ED: "Fine, send them whenever," then later to coworkers: "We\'ll just leave them in the hallway until we\'re ready."']]);

Q.push(
{id:'c8_1',cs:'C8',mod:6,t:'mc',step:'TA',topic:'T13',concept:'Responding to an ad hominem attack',
q:'Which response by the 4 West charge nurse to the ED charge nurse\'s statement is most appropriate?',
o:[['"Your department always rushes patients out, so it\'s no surprise information gets lost."',0,'Answers an attack with another attack.'],['"You\'re right that we complain a lot. We\'ll take transfers whenever you need to send them."',0,'Passive; abandons a valid safety concern.'],['"Our concern is timing: two transfers arrived during report with incomplete medication lists."',1,'Correct. Sets aside the personal attack and returns to the issue with data.'],['"I\'m taking this to the CNO, since you clearly aren\'t willing to talk with us about it."',0,'Escalates prematurely without trying to resolve it directly.']],
r:'Ad hominem attacks the person or group raising an issue instead of addressing the issue itself. The effective response does not take the bait; it returns to specific, objective facts.',
trap:'Respond to the issue, not the insult.'},
{id:'c8_2',cs:'C8',mod:6,t:'mc',step:'TA',topic:'T13',concept:'Addressing passive-aggressive communication',
q:'The 4 West charge nurse hears the nurse\'s later comment to coworkers. Which action by the charge nurse is most appropriate?',
o:[['Ignore the comment, since the nurse was only venting to coworkers and not speaking to the ED',0,'The comment signals a plan that could leave patients unsafe.'],['Tell the ED charge nurse that 4 West will accept every transfer immediately to avoid conflict',0,'Gives up on the valid handoff-timing concern.'],['Report the nurse to the manager for discipline, since leaving patients in a hallway is reckless',0,'The nurse has not acted yet; coaching comes before discipline.'],['Talk privately with the nurse about the comment and its safety risk, and invite her to help plan a fix',1,'Correct. Addresses passive-aggressive behavior directly and redirects it toward a solution.']],
r:'Passive-aggressive communication pairs outward agreement with indirect resistance or sarcasm, which undermines trust and can endanger patients. Address it directly and privately, then engage the person in a constructive solution.',
trap:'Surface agreement plus a hidden plan to obstruct needs a direct, private conversation.'},
{id:'c8_3',cs:'C8',mod:6,t:'mc',step:'GS',topic:'T13',concept:'Collaborative negotiation',
q:'The ED and 4 West managers meet to resolve the conflict. Which approach is most likely to produce a safe and lasting solution?',
o:[['Ask the chief nursing officer to set a firm transfer policy so the conflict between the units ends quickly',0,'Forcing a decision builds no shared ownership.'],['Agree that the ED may send patients anytime, because prolonged ED boarding is unsafe for admitted patients',0,'Accommodating one side ignores handoff safety.'],['Bring both units together to identify shared goals and agree on a transfer window with I-PASS',1,'Correct. Interest-based, collaborative negotiation.'],['Postpone discussion until the tension between the units settles down',0,'Avoidance leaves the risk in place.']],
r:'Collaboration addresses the issue rather than the people, focuses on shared goals (flow and safe handoffs) and produces a mutually acceptable plan. Forcing, accommodating and avoiding do not resolve the underlying problem.',
trap:'"Ends quickly" is attractive but forcing rarely produces durable, safe solutions.'},
{id:'c8_4',cs:'C8',mod:6,t:'cloze',step:'TA',topic:'T13',concept:'DESC script',
q:'The 4 West charge nurse uses DESC with the ED charge nurse. Complete the script by choosing from the lists of options.',
text:'Describe: "{0}" … Suggest: "{1}"',
blanks:[[['Three transfers last week arrived at 1900, during bedside report.','The ED keeps sending patients at the worst possible time.','We feel transfers at shift change are unsafe for patients.'],0,'Describe uses specific, objective data — not generalizations or blame.'],[['Could we hold stable transfers until 1930 and give I-PASS report by phone at 1845?','Please stop sending any patients during our shift change.','Could your charge nurse remind ED staff to give better report?'],0,'Suggest offers a specific alternative and seeks agreement.']],
r:'DESC: Describe the specific situation with data, Express concerns, Suggest alternatives and seek agreement, and state Consequences/reach Consensus.',
trap:'"Never" and "always" turn a Describe statement into an accusation.'},
{id:'c8_5',cs:'C8',mod:6,t:'matrix',step:'TA',topic:'T12',concept:'Brief, huddle, debrief, check-back',
q:'For each situation, indicate the TeamSTEPPS tool being used.',
cols:['Brief','Huddle','Debrief','Check-back'],
rows:[['ED and 4 West charge nurses meet at 1830 to plan expected transfers',0,'Planning before the work begins.'],['At 2000 a surge of admissions requires reassigning nurses mid-shift',1,'Adjusting the plan when conditions change.'],['After a difficult transfer, both teams review what went well and what to change',2,'Learning after the event.'],['ED nurse: "Hang the second bag at 2100." 4 West nurse: "Second bag at 2100." ED nurse: "Correct."',3,'Closed-loop confirmation of a message.']],
r:'Brief = before; huddle = during, when conditions change; debrief = after. Check-back closes the loop on a specific message between team members.',
trap:'Timing decides brief vs huddle vs debrief.'},
{id:'c8_6',cs:'C8',mod:6,t:'mc',step:'EO',topic:'T15',concept:'Evaluating collaboration outcomes',
q:'Two months after the units agree on a transfer window and I-PASS, which finding best indicates that the collaboration has improved safety?',
o:[['Staff in both units report on a survey that the transfer conflict is discussed much less often at meetings',0,'Less discussion could mean avoidance, not resolution.'],['Transfers with complete I-PASS handoffs rose to 95% and transfer-related near misses fell',1,'Correct. Process and outcome data tied to the shared goal.'],['The ED charge nurse apologized publicly to the 4 West staff for her comments at a joint staff meeting',0,'Positive, but not evidence of safer transfers.'],['4 West now accepts every transfer as soon as the ED calls',0,'Accommodation without a safe handoff process.']],
r:'Collaboration is judged by improved patient outcomes and reliable processes — here, complete handoffs and fewer transfer-related near misses.',
trap:'Peace is not the outcome measure; patient safety is.'});

/* ---------------- CASE 9 ---------------- */
addCase('C9',9,'The CLABSI Cluster',[
['Unit Data',[['Measure','ICU','National benchmark'],['CLABSI per 1,000 central-line days (last quarter)','3.1','0.8'],['Central-line days','1,290','—']]],
['Audit Findings','• Hub scrubbed before access: 62% of observations\n• Daily line-necessity review documented: 40% of line-days\n• Dressing changes on time: 85%\n• Chlorhexidine-impregnated caps stocked in a supply room on another floor\n• 14 of 38 RNs have completed central-line maintenance competency'],
['Staff Comments','"We keep lines in just in case we need access later." · "The caps are never here when we need them."']]);

Q.push(
{id:'c9_1',cs:'C9',mod:5,t:'matrix',step:'AC',topic:'T8',concept:'Donabedian structure, process, outcome',
q:'For each measure, indicate the Donabedian category.',
cols:['Structure','Process','Outcome'],
rows:[['CLABSI per 1,000 central-line days',2,'A result of care.'],['Percentage of accesses with hub scrubbed first',1,'Care actually delivered.'],['Number of RNs with central-line competency',0,'Clinician competence is a resource of the setting.'],['Availability of chlorhexidine caps on the unit',0,'Supplies are structure.'],['Daily necessity review documented',1,'Care actually delivered.']],
r:'Structure = resources (staff competence, supplies); Process = care delivered (hub scrub, necessity review); Outcome = results (infection rate).',
trap:'"Percentage of patients who received X" is process even though it is a number.'},
{id:'c9_2',cs:'C9',mod:5,t:'mc',step:'RC',topic:'T8',concept:'Benchmarking',
q:'Which interpretation of the unit data is most accurate?',
o:[['The ICU rate exceeds the national benchmark, signaling a need for improvement',1,'Correct. Benchmarking compares performance with peers or standards.'],['The rate cannot be judged without knowing each patient\'s diagnosis',0,'Rates per 1,000 line-days already standardize for exposure.'],['The rate is acceptable, because ICU patients are sicker and have more central-line days than average',0,'Rationalizing poor performance ignores a preventable, nurse-sensitive outcome.'],['The rate shows that individual nurses on the unit are consistently breaking sterile technique',0,'Data show a gap, not who caused it; jumping to individual blame is premature.']],
r:'Benchmarking compares performance with prior internal results or peer standards. A rate nearly four times the benchmark indicates a quality gap requiring analysis.',
trap:'Don\'t explain away a bad benchmark — and don\'t jump to blame either.'},
{id:'c9_3',cs:'C9',mod:5,t:'mc',step:'PH',topic:'T5',concept:'Latent condition with the widest reach',
q:'Which finding is a latent condition most likely contributing across many nurses and shifts?',
o:[['A nurse skipped the hub scrub during a code',0,'An active failure in a single event.'],['Chlorhexidine caps are stocked on another floor',1,'Correct. A supply condition that affects every access on every shift.'],['A patient repeatedly pulls at the dressing',0,'A patient factor in one case.'],['A femoral line was placed emergently in the ED during a code',0,'A single clinical circumstance, not a unit-wide condition.']],

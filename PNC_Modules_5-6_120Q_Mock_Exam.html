  S={phase:'exam',mode,randQ,randA,main:{ids,cur:0,ans:{}},retry:null,finished:false,flags:{},opt:optionOrders(randA),view:'q'};save();}
const ctx=()=>S.retry||S.main;
const inRetry=()=>!!S.retry;

/* ---------- grading ---------- */
function grade(q,sel){sel=sel||[];
  if(q.t==='mc'){const ok=sel.length===1&&q.o[sel[0]][1]===1;return{pts:ok?1:0,exact:ok,hits:ok?1:0,fs:ok?0:sel.length,n:1};}
  if(q.t==='sata'){const n=q.o.filter(o=>o[1]).length;const hits=sel.filter(i=>q.o[i][1]).length;const fs=sel.length-hits;return{pts:Math.max(0,(hits-fs)/n),exact:hits===n&&fs===0,hits,fs,n};}
  const key=q.t==='matrix'?q.rows.map(r=>r[1]):q.blanks.map(b=>b[1]);const n=key.length;const hits=key.filter((k,i)=>sel[i]===k).length;
  return{pts:hits/n,exact:hits===n,hits,fs:n-hits,n};}
function isAnswered(a,q){if(!a||!a.sel)return false;if(q&&multi(q))return a.sel.length===nParts(q)&&a.sel.every(v=>v!==null&&v!==undefined&&v>=0);return a.sel.length>0;}
function draftReady(a,q){return multi(q)?(a.draft.length===nParts(q)&&a.draft.every(v=>v!==null&&v!==undefined&&v>=0)):a.draft.length>0;}
function revealed(id){const c=ctx();const a=c.ans[id];if(inRetry())return!!(a&&a.sub);return(S.mode==='study'&&a&&a.sub)||S.finished;}
function tally(c,forceAll){let answered=0,correct=0,incorrect=0,pts=0,gradedN=0;
  c.ids.forEach(id=>{const q=QM[id];const a=c.ans[id];const ans=isAnswered(a,q);const counted=inRetry()&&c===S.retry?(a&&a.sub):(S.mode==='study'?(a&&a.sub):ans);
    if(counted)answered++;
    const visible=forceAll||(c===S.retry?(a&&a.sub):(S.mode==='study'?(a&&a.sub):S.finished));
    if(visible&&(counted||forceAll)){const g=grade(q,a?a.sel:[]);gradedN++;pts+=g.pts;if(g.exact)correct++;else incorrect++;}});
  return{answered,correct,incorrect,pts,gradedN,total:c.ids.length};}

/* ---------- top bar ---------- */
function renderTop(){const show=S.phase==='exam';$('#top').classList.toggle('hidden',!show);if(!show)return;
  const c=ctx();const t=tally(c);
  $('#modePill').textContent=inRetry()?'Retry missed':(S.finished?'Review':(S.mode==='study'?'Study mode':'Exam mode'));
  const pct=Math.round(t.answered/t.total*100);$('#pbarI').style.width=pct+'%';$('#pbar').setAttribute('aria-valuenow',pct);
  const hideScore=!inRetry()&&S.mode==='exam'&&!S.finished;const score=t.gradedN?Math.round(t.pts/t.gradedN*100)+'%':'—';
  $('#stats').innerHTML=`<span>Question <b>${c.cur+1}</b> of <b>${t.total}</b></span><span><b>${pct}%</b> completed (${t.answered}/${t.total})</span>`+
    (hideScore?`<span>Score: <b>hidden until you submit</b></span>`:`<span>Score: <b>${score}</b></span><span class="okc">Correct: <b>${t.correct}</b></span><span class="noc">Incorrect: <b>${t.incorrect}</b></span>`)+
    `<span>🚩 Flagged: <b>${Object.keys(S.flags).filter(k=>S.flags[k]&&c.ids.includes(k)).length}</b></span>`;
  $('#finishBtn').textContent=inRetry()?'End retry':(S.finished?'Score report':(S.mode==='exam'?'Submit exam':'Finish & see report'));}

/* ---------- start screen ---------- */
const GHOST=`<div class="examicon" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v3H9z"/><path d="M7 4.5H5.5A1.5 1.5 0 0 0 4 6v14a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 20V6a1.5 1.5 0 0 0-1.5-1.5H17"/><path d="M8.5 13l2.5 2.5 4.5-5"/></svg></div>`;
const WEB=`<svg class="web" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="#5a2f8c" stroke-width="1"><path d="M100 0L0 100M100 0L0 45M100 0L55 100M100 0L0 12M100 0L88 100"/><path d="M78 0Q81 12 100 22M54 0Q59 27 100 46M30 0Q38 42 100 70M4 0Q14 58 100 96"/></svg>`;
function renderStart(){const saved=S.main&&!S.finished?S.main:null;const N=Q.length;
  const cnt=t=>Q.filter(q=>q.t===t).length;const m5=Q.filter(q=>q.mod===5).length;
  app.innerHTML=`<section class="hero">${GHOST}<h1>Modules 5–6 Practice Exam</h1><p>Professional Nursing Capstone · Module 5 (Healthcare Quality &amp; Safety) + Module 6 (Communication &amp; Collaboration)</p><p class="note" style="color:#bfaee0">${N}-question NGN / NCLEX-style exam · PowerPoint-priority content</p></section>
  <section class="panel">${WEB}<h2>Exam overview</h2>
  <div class="facts"><div class="fact"><b>${N}</b><span>questions</span></div><div class="fact"><b>${m5}</b><span>Module 5</span></div><div class="fact"><b>${N-m5}</b><span>Module 6</span></div><div class="fact"><b>${Object.keys(CASES).length}</b><span>NGN case studies</span></div><div class="fact"><b>${cnt('mc')}</b><span>multiple choice</span></div><div class="fact"><b>${cnt('sata')}</b><span>SATA</span></div><div class="fact"><b>${cnt('matrix')}</b><span>matrix</span></div><div class="fact"><b>${cnt('cloze')}</b><span>drop-down cloze</span></div></div>
  <p class="note">Each of the 10 case studies walks through the Clinical Judgment Measurement Model — Recognize Cues → Analyze Cues → Prioritize Hypotheses → Generate Solutions → Take Action → Evaluate Outcomes — using chart tabs (Nurses' Notes, Vital Signs, Orders) like the NGN exam. Expect priority, "first action," and "requires follow-up" wording; distractors are deliberately plausible, and answer positions are balanced.</p>
  <h3>Choose your path</h3>
  <div class="modes" role="radiogroup" aria-label="Exam mode">
   <label class="mode ${S.mode!=='exam'?'sel':''}"><input type="radio" name="mode" value="study" ${S.mode!=='exam'?'checked':''}><b>📖 Study Mode</b><p>Submit each question to see the answer, full rationale, why each option is right or wrong, the NGN step, and a Professor Trap.</p></label>
   <label class="mode ${S.mode==='exam'?'sel':''}"><input type="radio" name="mode" value="exam" ${S.mode==='exam'?'checked':''}><b>⏳ Exam Mode</b><p>Save and change answers anytime. No answers, score, or rationales appear until you submit all ${N}.</p></label>
  </div>
  <label class="chk"><input type="checkbox" id="rq" ${S.randQ?'checked':''}><span>Randomize question order<small>Case-study questions stay together and in order.</small></span></label>
  <label class="chk"><input type="checkbox" id="ra" ${S.randA?'checked':''}><span>Randomize answer-choice order<small>Off = a fixed order with correct answers spread evenly across A, B, C and D.</small></span></label>
  <h3>Scoring</h3><p class="note"><b>SATA:</b> (correct selections − incorrect selections) ÷ number of correct options, minimum 0. <b>Matrix &amp; drop-down:</b> 1 point per correct row/blank ÷ total rows/blanks. An item counts as "correct" only when every part is right.</p>
  <div class="row end" style="margin-top:14px">${saved?`<button class="btn sec" id="resumeBtn">Resume exam (${saved.ids.filter(id=>isAnswered(saved.ans[id],QM[id])).length}/${saved.ids.length} answered)</button>`:''}<button class="btn" id="beginBtn">${saved?'Start a new exam':'Begin exam →'}</button></div>
  </section>`;
  app.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{app.querySelectorAll('.mode').forEach(m=>m.classList.toggle('sel',m.querySelector('input').checked));});
  $('#beginBtn').onclick=()=>{const go=()=>{const mode=app.querySelector('input[name=mode]:checked').value;build(mode,$('#rq').checked,$('#ra').checked);render();};
    if(saved)confirmBox('Start a new exam?','Your in-progress answers will be cleared.','Start new',go);else go();};
  if(saved)$('#resumeBtn').onclick=()=>{S.phase='exam';save();render();};}

/* ---------- case chart tabs ---------- */
function tabContent(c){if(Array.isArray(c))return `<div class="tw"><table class="ehr"><thead><tr>${c[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.slice(1).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  return `<p>${esc(c).replace(/\n/g,'<br>')}</p>`;}
function renderCase(cs,first){return `<details class="case" ${first?'open':''}><summary>Case ${cs.n}: ${esc(cs.title)} <span class="note">— medical record</span></summary>
  <div class="tabs" role="tablist">${cs.tabs.map((t,i)=>`<button type="button" role="tab" class="tab ${i===0?'on':''}" data-tab="${i}" aria-selected="${i===0}">${esc(t[0])}</button>`).join('')}</div>
  ${cs.tabs.map((t,i)=>`<div class="tabp ${i===0?'':'hidden'}" data-panel="${i}">${tabContent(t[1])}</div>`).join('')}</details>`;}

/* ---------- question screen ---------- */
function renderQ(){const c=ctx();const id=c.ids[c.cur];const q=QM[id];
  const a=c.ans[id]||(c.ans[id]={sel:[],draft:[]});if(!a.draft)a.draft=a.sel.slice();
  const rev=revealed(id);const cs=q.cs?CASES[q.cs]:null;const csIdx=cs?DEFAULT_ORDER.filter(x=>QM[x].cs===q.cs):[];
  const draft=rev?a.sel:a.draft;let body='';
  if(q.t==='mc'||q.t==='sata'){const isS=q.t==='sata';const order=S.opt[id];
    body=`<div class="opts" role="${isS?'group':'radiogroup'}" aria-labelledby="qn">`+order.map((oi,pos)=>{const o=q.o[oi];const picked=draft.includes(oi);let cls='opt'+(isS?' sata':'')+(picked?' sel':'');let tag='';
      if(rev){if(o[1]&&picked){cls+=' right';tag='✓ correct';}else if(o[1]){cls+=' right missed';tag=isS?'missed':'correct answer';}else if(picked){cls+=' wrong';tag='✗ your choice';}}
      return `<button class="${cls}" data-oi="${oi}" ${rev?'disabled':''} role="${isS?'checkbox':'radio'}" aria-checked="${picked}"><span class="k">${isS&&picked?'✓':LET(pos)}</span><span>${esc(o[0])}</span>${tag?`<span class="tagl">${tag}</span>`:''}</button>`;}).join('')+`</div>`;}
  else if(q.t==='matrix'){body=`<div class="tw"><table class="mx"><thead><tr><th>Finding / item</th>${q.cols.map(cn=>`<th>${esc(cn)}</th>`).join('')}</tr></thead><tbody>${q.rows.map((r,ri)=>`<tr><td>${esc(r[0])}</td>${q.cols.map((cn,ci)=>{const picked=draft[ri]===ci;let cl='mxc';if(rev){if(r[1]===ci)cl+=picked?' right':' missed';else if(picked)cl+=' wrong';}
      return `<td class="${cl}"><label><input type="radio" name="r${ri}" data-ri="${ri}" data-ci="${ci}" ${picked?'checked':''} ${rev?'disabled':''} aria-label="${esc(r[0])}: ${esc(cn)}"><span class="mxl">${esc(cn)}</span></label></td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`;}
  else if(q.t==='cloze'){const ord=S.opt[id];let k=0;body=`<div class="cloze">`+esc(q.text).replace(/\{(\d)\}/g,(m,d)=>{const bi=+d;const b=q.blanks[bi];const v=draft[bi];
      let cl='dd';if(rev)cl+=v===b[1]?' right':' wrong';
      return `<select class="${cl}" data-bi="${bi}" ${rev?'disabled':''} aria-label="Blank ${bi+1}"><option value="-1">Select…</option>${ord[bi].map(oi=>`<option value="${oi}" ${v===oi?'selected':''}>${esc(b[0][oi])}</option>`).join('')}</select>`;})+`</div>`;}
  const examSaved=!inRetry()&&S.mode==='exam'&&!S.finished;
  const same=JSON.stringify(a.draft)===JSON.stringify(a.sel)||(!multi(q)&&JSON.stringify([...a.draft].sort())===JSON.stringify([...a.sel].sort()));
  let action='';
  if(!rev){const ready=draftReady(a,q);
    if(examSaved)action=`<div class="row end" style="margin-top:12px">${isAnswered(a,q)?(same?'<span class="saved">✓ Answer saved</span>':'<span class="unsaved">Unsaved change</span>'):''}<button class="btn" id="subBtn" ${ready?'':'disabled'}>${isAnswered(a,q)?'Update answer':'Save answer'}</button></div>`;
    else action=`<div class="row end" style="margin-top:12px">${multi(q)&&!ready?`<span class="unsaved">Answer every ${q.t==='matrix'?'row':'blank'} to submit</span>`:''}<button class="btn" id="subBtn" ${ready?'':'disabled'}>Submit answer</button></div>`;}
  const flagged=!!S.flags[id];
  const instr={sata:'Select all that apply. More than one answer may be correct.',matrix:'For each row, select one option. Each row is scored separately.',cloze:'Select one option from each drop-down list.'}[q.t];
  app.innerHTML=`<section class="panel" aria-labelledby="qn">
   ${inRetry()?`<p class="note" style="margin-top:0">🔁 <b>Retry mode</b>: these are the questions you missed. Feedback appears after each one; your original score is unchanged.</p>`:''}
   <div class="qhead"><span class="qnum" id="qn">Question ${c.cur+1}</span><span class="chip ${q.t==='mc'?'':'sata'}">${TYPE[q.t]}</span>${cs?`<span class="chip case">Case ${cs.n} · ${csIdx.indexOf(id)+1} of ${csIdx.length}</span>`:''}${flagged?'<span class="chip flag">🚩 Flagged</span>':''}</div>
   ${cs?renderCase(cs,true):''}
   <div class="stem">${esc(q.q)}</div>
   ${instr&&!rev?`<div class="instr">${instr}</div>`:''}
   ${body}${action}
   ${rev?feedback(q,a.sel,S.opt[id]):''}
   <nav class="nav" aria-label="Question navigation">
     <div class="grp"><button class="btn sec" id="prevBtn" ${c.cur===0?'disabled':''}>← Previous</button><button class="btn sec" id="nextBtn" ${c.cur===c.ids.length-1?'disabled':''}>Next →</button></div>
     <div class="grp"><button class="btn dark ${flagged?'flag-on':''}" id="flagBtn" aria-pressed="${flagged}">${flagged?'🚩 Unflag':'🚩 Flag for review'}</button><button class="btn dark" id="toFlagBtn">Return to flagged</button></div>
   </nav>
   ${c.cur===c.ids.length-1&&!S.finished&&!inRetry()?`<div class="row end" style="margin-top:12px"><button class="btn" id="endBtn">${S.mode==='exam'?'Submit exam for grading':'See my score report'}</button></div>`:''}
   ${inRetry()&&c.ids.every(i=>c.ans[i]&&c.ans[i].sub)?`<div class="row end" style="margin-top:12px"><button class="btn" id="endBtn">Finish retry → back to report</button></div>`:''}
  </section>
  <section class="panel hidden" id="mapPanel"><h2>Question map</h2><div class="grid" id="grid"></div>
   <div class="legend"><span>⬜ unanswered</span><span>🟪 answered</span><span>🟩 correct</span><span>🟨 partial</span><span>🟥 incorrect</span><span>🚩 flagged</span></div></section>`;
  app.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{const box=t.closest('.case');box.querySelectorAll('.tab').forEach(x=>{x.classList.toggle('on',x===t);x.setAttribute('aria-selected',x===t);});box.querySelectorAll('.tabp').forEach(p=>p.classList.toggle('hidden',p.dataset.panel!==t.dataset.tab));});
  if(!rev){
    if(q.t==='mc'||q.t==='sata')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const oi=+b.dataset.oi;
      if(q.t==='sata'){const i=a.draft.indexOf(oi);if(i>=0)a.draft.splice(i,1);else a.draft.push(oi);}else a.draft=[oi];
      save();renderQ();renderTop();const el=app.querySelector(`.opt[data-oi="${oi}"]`);if(el)el.focus();});
    if(q.t==='matrix')app.querySelectorAll('.mx input').forEach(inp=>inp.onchange=()=>{const n=nParts(q);while(a.draft.length<n)a.draft.push(-1);a.draft[+inp.dataset.ri]=+inp.dataset.ci;save();refreshAction(a,q);});
    if(q.t==='cloze')app.querySelectorAll('.cloze select').forEach(s=>s.onchange=()=>{const n=nParts(q);while(a.draft.length<n)a.draft.push(-1);a.draft[+s.dataset.bi]=+s.value;save();refreshAction(a,q);});
  }
  const sb=$('#subBtn');if(sb)sb.onclick=()=>{a.sel=a.draft.slice();if(S.mode==='study'||inRetry())a.sub=true;save();renderQ();renderTop();
    if(a.sub){const g=grade(q,a.sel);toast(g.exact?'✓ Correct':g.pts>0?'◐ Partially correct':'✗ Incorrect — review the rationale');const f=app.querySelector('.fb');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'});}else toast('Answer saved');};
  $('#prevBtn').onclick=()=>go(c.cur-1);$('#nextBtn').onclick=()=>go(c.cur+1);
  $('#flagBtn').onclick=()=>{S.flags[id]=!S.flags[id];if(!S.flags[id])delete S.flags[id];save();renderQ();renderTop();};
  $('#toFlagBtn').onclick=()=>{const fl=c.ids.map((x,i)=>[x,i]).filter(([x])=>S.flags[x]);if(!fl.length){toast('No flagged questions yet');return;}
    const nxt=fl.find(([,i])=>i>c.cur)||fl[0];if(nxt[1]===c.cur&&fl.length===1){toast('This is your only flagged question');return;}go(nxt[1]);};
  const eb=$('#endBtn');if(eb)eb.onclick=finish;
  renderGrid();}
function refreshAction(a,q){const sb=$('#subBtn');if(!sb)return;const ready=draftReady(a,q);sb.disabled=!ready;const hint=sb.previousElementSibling;
  if(hint&&hint.classList.contains('unsaved'))hint.style.display=ready&&!(S.mode==='exam'&&!S.finished&&!inRetry())?'none':'';renderTop();}

function feedback(q,sel,order){const g=grade(q,sel);const cls=g.exact?'ok':(g.pts>0?'part':'no');
  const answered=multi(q)?sel.length>0:sel.length>0;
  const head=!answered?'Not answered':g.exact?'✓ Correct':(g.pts>0?'◐ Partially correct':'✗ Incorrect');
  let detail='',scoreLine='';
  if(q.t==='mc'||q.t==='sata'){const pos=oi=>LET(order.indexOf(oi));const correct=order.filter(oi=>q.o[oi][1]).map(pos);
    scoreLine=`<p><b>Correct answer${correct.length>1?'s':''}: ${correct.join(', ')}</b></p>`+(q.t==='sata'&&sel.length?`<p>You selected <b>${g.hits} of ${g.n}</b> correct options and <b>${g.fs}</b> incorrect → <b>${(+g.pts.toFixed(2))} / 1</b> point.</p>`:`<p><b>${g.pts} / 1</b> point.</p>`);
    detail=`<ul class="why">${order.map(oi=>{const o=q.o[oi];return `<li><span class="L">${pos(oi)}.</span> ${o[1]?'✅':'❌'} ${sel.includes(oi)?'<i>(you chose)</i> ':''}<b>${o[1]?'Correct':'Incorrect'}:</b> ${esc(o[2])}</li>`;}).join('')}</ul>`;}
  else if(q.t==='matrix'){scoreLine=`<p><b>${g.hits} of ${g.n}</b> rows correct → <b>${(+g.pts.toFixed(2))} / 1</b> point.</p>`;
    detail=`<ul class="why">${q.rows.map((r,i)=>`<li>${sel[i]===r[1]?'✅':'❌'} <b>${esc(r[0])}</b> → <b>${esc(q.cols[r[1]])}</b>${sel[i]!==r[1]&&sel[i]>=0?` <i>(you chose ${esc(q.cols[sel[i]])})</i>`:''}. ${esc(r[2])}</li>`).join('')}</ul>`;}
  else{scoreLine=`<p><b>${g.hits} of ${g.n}</b> blanks correct → <b>${(+g.pts.toFixed(2))} / 1</b> point.</p>`;
    detail=`<ul class="why">${q.blanks.map((b,i)=>`<li>${sel[i]===b[1]?'✅':'❌'} Blank ${i+1}: <b>${esc(b[0][b[1]])}</b>${sel[i]!==b[1]&&sel[i]>=0?` <i>(you chose "${esc(b[0][sel[i]])}")</i>`:''}. ${esc(b[2])}</li>`).join('')}</ul>`;}
  return `<div class="fb ${cls}" role="status"><h3>${head}</h3>${scoreLine}<p><b>Rationale:</b> ${esc(q.r)}</p>${detail}
   <div class="meta"><span>🧠 NGN: ${STEPS[q.step]}</span><span>🔑 ${esc(q.concept)}</span><span>📚 Module ${q.mod}</span><span>🗂️ ${esc(TOPICS[q.topic][0])}</span></div>
   ${q.trap?`<div class="trap"><b>⚠️ Professor Trap / Testing Strategy:</b> ${esc(q.trap)}</div>`:''}</div>`;}
function renderGrid(){const c=ctx();const gEl=$('#grid');if(!gEl)return;
  gEl.innerHTML=c.ids.map((id,i)=>{const a=c.ans[id];const q=QM[id];let cl='cell';
    if(revealed(id)&&(isAnswered(a,q)||S.finished)){const g=grade(q,a?a.sel:[]);cl+=g.exact?' c':(g.pts>0?' p':' x');}else if(isAnswered(a,q))cl+=' ans';
    if(i===c.cur)cl+=' cur';if(S.flags[id])cl+=' fl';
    return `<button class="${cl}" data-i="${i}" aria-label="Question ${i+1}${S.flags[id]?', flagged':''}">${i+1}</button>`;}).join('');
  gEl.querySelectorAll('.cell').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const mp=$('#mapPanel');if(mp)mp.classList.toggle('hidden',S.view!=='map');$('#mapBtn').setAttribute('aria-expanded',S.view==='map');}
function go(i){const c=ctx();if(i<0||i>=c.ids.length)return;c.cur=i;save();renderQ();renderTop();window.scrollTo({top:0,behavior:'smooth'});}

/* ---------- finish ---------- */
function finish(){if(inRetry()){S.retry=null;S.phase='report';save();render();return;}
  if(S.finished){S.phase='report';save();render();return;}
  const c=S.main;const un=c.ids.filter(id=>!(S.mode==='study'?(c.ans[id]&&c.ans[id].sub):isAnswered(c.ans[id],QM[id]))).length;const fl=c.ids.filter(id=>S.flags[id]).length;
  confirmBox(S.mode==='exam'?'Submit your exam?':'Finish and see your report?',(un?`You have <b>${un}</b> unanswered question${un>1?'s':''} (scored as 0). `:'All questions answered. ')+(fl?`You still have <b>${fl}</b> flagged question${fl>1?'s':''}. `:'')+'You won\'t be able to change answers afterward.',
    'Submit & grade',()=>{S.finished=true;S.phase='report';save();render();});}

/* ---------- report ---------- */
function bandFor(p){if(p>=90)return['Exam Ready','Excellent — keep reviewing the Professor Traps.'];if(p>=80)return['Proficient','Strong work. Tighten the weak areas below.'];if(p>=70)return['Developing','Passing range, but several topics need another pass.'];return['Needs Review','Revisit the recommended topics below, then retry your missed questions.'];}
function group(keyFn){const m={};S.main.ids.forEach(id=>{const q=QM[id];const k=keyFn(q);const a=S.main.ans[id];const g=grade(q,a?a.sel:[]);m[k]=m[k]||{n:0,pts:0,c:0};m[k].n++;m[k].pts+=g.pts;if(g.exact)m[k].c++;});return m;}
function pctOf(o){return o&&o.n?Math.round(o.pts/o.n*100):0;}
function color(p){return p>=80?'#1e7a4f':p>=70?'#d79b2a':'#b3283a';}
function hbar(label,o){if(!o)return'';const p=pctOf(o);return `<div class="hbar"><span>${label} <span class="note">(${o.c}/${o.n} fully correct)</span></span><div class="t"><i style="width:${p}%;background:${color(p)}"></i></div><span class="v">${p}%</span></div>`;}
function renderReport(){const t=tally(S.main,true);const total=S.main.ids.length;const pct=Math.round(t.pts/total*100);const [title,sub]=bandFor(pct);
  const byMod=group(q=>q.mod),byType=group(q=>q.t),byStep=group(q=>q.step),byTopic=group(q=>q.topic),byCase=group(q=>q.cs||'none');
  const topics=Object.keys(byTopic).map(k=>({k,p:pctOf(byTopic[k]),o:byTopic[k]})).sort((a,b)=>b.p-a.p||b.o.n-a.o.n);
  const strong=topics.slice(0,3),weak=topics.slice(-3).reverse();const recs=topics.filter(x=>x.p<80).sort((a,b)=>a.p-b.p);
  const missed=S.main.ids.filter(id=>!grade(QM[id],(S.main.ans[id]||{}).sel).exact);
  app.innerHTML=`<section class="panel">${WEB}
   <div class="verdict"><div class="big">${pct}%</div><h2>${title}</h2><p style="margin:0;color:#d9c8f5">${sub}</p></div>
   <div class="tiles">
    <div class="tile"><small>Total score</small><b>${(Math.round(t.pts*100)/100)} / ${total}</b><span>points (partial credit on SATA, matrix, cloze)</span></div>
    <div class="tile"><small>Percentage</small><b>${pct}%</b><span>${S.mode==='exam'?'Exam mode':'Study mode'}</span></div>
    <div class="tile"><small>Fully correct</small><b>${t.correct}</b><span>${t.incorrect} incorrect or partial</span></div>
    <div class="tile"><small>Module 5</small><b>${pctOf(byMod[5])}%</b><span>${byMod[5].c}/${byMod[5].n} correct</span></div>
    <div class="tile"><small>Module 6</small><b>${pctOf(byMod[6])}%</b><span>${byMod[6].c}/${byMod[6].n} correct</span></div>
   </div>
   <h3>Question type</h3>${['mc','sata','matrix','cloze'].map(k=>hbar(TYPE[k],byType[k])).join('')}
   <h3>Performance by NGN step</h3>${Object.keys(STEPS).filter(k=>byStep[k]).map(k=>hbar(STEPS[k],byStep[k])).join('')}
   <h3>Case studies</h3>${Object.keys(CASES).sort((a,b)=>CASES[a].n-CASES[b].n).map(k=>hbar(`Case ${CASES[k].n}: ${esc(CASES[k].title)}`,byCase[k])).join('')}
   <h3>Strongest areas</h3><ul>${strong.map(x=>`<li><b>${esc(TOPICS[x.k][0])}</b>: ${x.p}%</li>`).join('')}</ul>
   <h3>Weakest areas</h3><ul>${weak.map(x=>`<li><b>${esc(TOPICS[x.k][0])}</b>: ${x.p}%</li>`).join('')}</ul>
   <h3>Topics recommended for review</h3>${recs.length?`<ol class="reclist">${recs.map(x=>`<li><b>${esc(TOPICS[x.k][0])} (${x.p}%)</b>: ${esc(TOPICS[x.k][1])}</li>`).join('')}</ol>`:'<p>Every content area scored 80% or higher. Keep your edge by reviewing the Professor Traps.</p>'}
   <h3>All content areas</h3><div class="tw"><table><thead><tr><th>Content area</th><th>Questions</th><th>Fully correct</th><th>Score</th></tr></thead><tbody>${topics.map(x=>`<tr><td>${esc(TOPICS[x.k][0])}</td><td>${x.o.n}</td><td>${x.o.c}</td><td><b style="color:${color(x.p)}">${x.p}%</b></td></tr>`).join('')}</tbody></table></div>
   <div class="row end" style="margin-top:18px"><button class="btn sec" id="revBtn">Review all questions &amp; rationales</button>${missed.length?`<button class="btn" id="retryBtn">🔁 Retry ${missed.length} missed question${missed.length>1?'s':''}</button>`:''}<button class="btn dark" id="resetBtn">Reset exam</button></div>
  </section>`;
  $('#revBtn').onclick=()=>{S.phase='exam';S.main.cur=0;save();render();};
  const rb=$('#retryBtn');if(rb)rb.onclick=()=>{S.retry={ids:missed.slice(),cur:0,ans:{}};S.phase='exam';save();render();};
  $('#resetBtn').onclick=resetAll;if(pct>=90)boo();}
function boo(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;const e=['★','●','◆','✓'];for(let i=0;i<22;i++){const s=document.createElement('span');s.textContent=e[i%4];s.style.color=['#0e7490','#1f3a5f','#b45309','#22d3ee'][i%4];s.style.cssText=`position:fixed;top:-40px;left:${Math.random()*100}vw;font-size:1.6rem;z-index:70;pointer-events:none;transition:transform ${2.5+Math.random()*2}s linear,opacity 4s`;document.body.appendChild(s);requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.transform=`translateY(110vh) rotate(${Math.random()*360}deg)`;}));setTimeout(()=>s.remove(),5000);}}

/* ---------- utilities ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function confirmBox(title,body,okText,ok){const m=$('#modal');$('#mbox').innerHTML=`<h3 id="mTitle">${title}</h3><p>${body}</p><div class="row end"><button class="btn sec" id="mNo">Cancel</button><button class="btn" id="mYes">${okText}</button></div>`;m.classList.add('open');$('#mYes').focus();
  $('#mNo').onclick=()=>m.classList.remove('open');$('#mYes').onclick=()=>{m.classList.remove('open');ok();};}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('open');});
function resetAll(){confirmBox('Reset the exam?','This completely clears all answers, flags, and scores.','Reset everything',()=>{try{localStorage.removeItem(KEY);}catch(e){}S=blank();render();toast('Exam reset');});}
$('#finishBtn').onclick=finish;
$('#mapBtn').onclick=()=>{S.view=S.view==='map'?'q':'map';save();renderGrid();if(S.view==='map')$('#mapPanel').scrollIntoView({behavior:'smooth'});};
function render(){if(S.phase==='exam'&&S.main){renderQ();}else if(S.phase==='report'&&S.main&&S.finished){renderReport();}else{S.phase='start';renderStart();}renderTop();window.scrollTo(0,0);}
render();
window.__exam={get S(){return S;},QM,grade,DEFAULT_ORDER};
})();

</script>
</body>
</html>

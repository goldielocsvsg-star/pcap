r:'Latent conditions are hidden system weaknesses that make active failures more likely everywhere. A supply that is never at the bedside sets up every nurse to skip a step.',
trap:'Look for the condition that would affect the most people, most of the time.'},
{id:'c9_4',cs:'C9',mod:5,t:'sata',step:'GS',topic:'T9',concept:'CLABSI prevention bundle',
q:'Which nursing actions reduce the risk of CLABSI? Select all that apply.',
o:[['Scrub the hub with antiseptic before each access',1,'Reduces intraluminal contamination.'],['Replace central lines routinely every 7 days',0,'Not recommended; adds insertion risk.'],['Perform hand hygiene before handling the line',1,'Core bundle element.'],['Review and document line necessity daily',1,'Early removal is key to prevention.'],['Keep the line after therapy ends in case access is needed',0,'Every extra line-day increases infection risk.'],['Use chlorhexidine skin antisepsis for dressing changes per protocol',1,'Evidence-based antisepsis.']],
r:'CLABSI prevention relies on evidence-based bundles: hand hygiene, hub disinfection, aseptic technique, chlorhexidine antisepsis, and daily necessity review with timely removal.',
trap:'"Just in case" lines and routine replacement sound protective but increase risk.'},
{id:'c9_5',cs:'C9',mod:6,t:'mc',step:'TA',topic:'T12',concept:'Cross-monitoring and speaking up',
q:'The nurse observes a colleague preparing to flush a central line without scrubbing the hub. Which action should the nurse take?',
o:[['Wait until the flush is complete and then remind the colleague privately',0,'Too late; the contamination risk has already occurred.'],['Report the colleague to the manager after the shift',0,'Does not prevent harm now and skips direct communication.'],['Say, "Wait — let\'s scrub the hub first," before the line is accessed',1,'Correct. Speak up in the moment to prevent the error.'],['Document the observation on the bundle audit form',0,'Audit data matter, but the patient needs protection now.']],
r:'Cross-monitoring means watching teammates\' actions and catching errors before they reach the patient. Psychological safety allows any team member to speak up in the moment.',
trap:'Feedback after the fact is useful — but not when you can still prevent the error.'},
{id:'c9_6',cs:'C9',mod:5,t:'mc',step:'EO',topic:'T7',concept:'Interpreting a run chart',
q:'After the bundle is reinforced, monthly CLABSI rates are 3.1, 2.9, 1.0, 0.9 and 0.8. Which conclusion is most appropriate?',
o:[['The problem is solved, so the team can stop measuring',0,'Ongoing monitoring is needed to sustain gains.'],['A sustained shift suggests real improvement; continue monitoring',1,'Correct. Several consecutive points at the new level indicate meaningful change.'],['One month at 1.0 proves the bundle caused the change',0,'A single point does not establish a trend.'],['The data are inconclusive until the rate reaches zero',0,'Improvement is judged against baseline and benchmark, not perfection.']],
r:'Run charts distinguish normal variation from meaningful change. A sustained shift across several months suggests real improvement, and continued measurement confirms it holds.',
trap:'One good month is variation; a sustained shift is a signal.'});

/* ---------------- CASE 10 ---------------- */
addCase('C10',10,'The Discharge Medication List',[
['Event Summary','An 80-year-old is discharged to a skilled nursing facility (SNF) after hip surgery. Apixaban was started in the hospital. Home warfarin was supposed to be discontinued, but the discharge medication list still includes warfarin because the admission medication list was copied forward in the EHR. The SNF administers both. On day 3 the patient develops a GI bleed.'],
['Review Findings','• The discharge nurse had three simultaneous discharges.\n• The discharge process has no step comparing the final list with the pre-admission list.\n• Policy does not require pharmacist reconciliation for SNF discharges.\n• Handoff to the SNF consisted of a faxed medication list and a 2-minute call: "She\'s stable, all meds are on the list."']]);

Q.push(
{id:'c10_1',cs:'C10',mod:5,t:'mc',step:'RC',topic:'T1',concept:'Preventable adverse event from a medication error',
q:'How should this event be classified?',
o:[['Unpreventable adverse event from known anticoagulant risks',0,'Duplicate anticoagulation was preventable.'],['Near miss, because the bleeding was identified and treated',0,'The error reached the patient and caused harm.'],['Preventable adverse event resulting from a medication error',1,'Correct. A reconciliation error reached the patient and caused harm.'],['Medical negligence by the SNF nurse who gave the medications',0,'The SNF followed the list it received; this was a system failure.']],
r:'A medication error (duplicate anticoagulation from failed reconciliation) reached the patient and caused harm — a preventable adverse event that must be reported and analyzed.',
trap:'Known side effects make an event "unpreventable" only when the care itself was correct.'},
{id:'c10_2',cs:'C10',mod:5,t:'matrix',step:'AC',topic:'T6',concept:'Fishbone categories',
q:'For each contributing factor, indicate the fishbone category it best fits.',
cols:['People','Methods / Process','Machines / Technology','Policies'],
rows:[['The EHR copied the admission medication list forward',2,'A technology/interface factor.'],['The discharge nurse had three simultaneous discharges',0,'Workload is a people factor.'],['No step compares the final list with the pre-admission list',1,'A missing step in the process.'],['Pharmacist reconciliation is not required for SNF discharges',3,'A policy gap.']],
r:'Fishbone categories organize contributing causes: People (workload, training, fatigue), Methods (workflow steps), Machines (EHR, devices), Materials, Policies, Environment, Measurement.',
trap:'Workload sounds like environment, but the course lists it under People.'},
{id:'c10_3',cs:'C10',mod:6,t:'mc',step:'PH',topic:'T11',concept:'Handoff failure at a care transition',
q:'Which communication failure most directly allowed the error to reach the patient?',
o:[['The SNF did not call the hospital pharmacist to verify the list after the patient arrived',0,'The receiving facility relied on the information it was given.'],['The handoff did not identify discontinued and new medications',1,'Correct. A handoff must include recent changes and an action list.'],['The patient\'s family was not present at discharge',0,'Family involvement helps but was not the direct failure.'],['The discharge summary was faxed instead of emailed',0,'The transmission method was not the problem; the content was.']],
r:'Handoffs transfer information, authority and responsibility. Omitting medication changes ("all meds are on the list") at a transition is a high-risk communication failure.',
trap:'"Stable, everything\'s on the list" is the same vague handoff as in Case 1.'},
{id:'c10_4',cs:'C10',mod:5,t:'mc',step:'GS',topic:'T6',concept:'Strongest countermeasure',
q:'Which countermeasure is strongest for preventing recurrence?',
o:[['Send all discharge nurses an email reminder to double-check every anticoagulant on the list',0,'A weak, memory-dependent fix.'],['Add an EHR hard stop requiring every home medication to be continued or stopped',1,'Correct. A forcing function built into the process.'],['Provide the discharge nurse with one-on-one education on reconciling anticoagulants',0,'Education alone relies on vigilance and addresses one person.'],['Post a sign about anticoagulant safety at the nurses\' station',0,'Signs are easily habituated to.']],
r:'Forcing functions and standardization are stronger than education, reminders or signs because they do not depend on memory or vigilance.',
trap:'If an option makes the error impossible to complete, it is the strongest.'},
{id:'c10_5',cs:'C10',mod:6,t:'cloze',step:'TA',topic:'T11',concept:'Closed-loop handoff to another facility',
q:'For the next SNF transfer, complete the sentence by choosing from the lists of options.',
text:'The nurse should give report using {0} and then ask the receiving nurse to {1}.',
blanks:[[['I-PASS, including an action list of medication changes','a faxed medication list followed by a short call','a verbal summary of the hospital course and vital signs'],0,'A standardized tool with explicit medication changes.'],[['summarize the medication changes back for confirmation','confirm receipt of the faxed medication list','call the unit later if any questions come up'],0,'Synthesis by receiver closes the loop.']],
r:'Standardized handoffs reduce omissions; synthesis by the receiver (restating key changes) confirms that critical information was received correctly.',
trap:'A signature proves receipt of paper, not understanding.'},
{id:'c10_6',cs:'C10',mod:6,t:'mc',step:'EO',topic:'T11',concept:'Evaluating closed-loop communication',
q:'Which statement by the receiving SNF nurse indicates that the handoff was effective?',
o:[['"Got it — I\'ll look over the list when she arrives."',0,'Acknowledges receipt but does not confirm content.'],['"So warfarin is discontinued and apixaban 2.5 mg twice daily is new — correct?"',1,'Correct. The receiver restates the specific changes for confirmation.'],['"Thanks for calling. Is she still stable for transport?"',0,'Asks about status but not the medication changes.'],['"We\'ll call the pharmacy tomorrow to verify everything."',0,'Defers verification and leaves the loop open.']],
r:'The receiver\'s synthesis of specific changes confirms that critical information was transferred accurately — closing the communication loop.',
trap:'Look for the receiver repeating the specifics, not just acknowledging.'});

/* ===== STANDALONE ITEMS — MODULE 5 (39) ===== */
Q.push(
{id:'s5_01',mod:5,t:'mc',step:'AC',topic:'T1',concept:'Omission and preventable adverse event',
q:'A post-op patient\'s 0900 enoxaparin is held because the patient is in radiology. When the patient returns at 1030, no one gives the dose and no further doses are given that day. On post-op day 3 the patient develops a DVT. Which classification is most accurate?',
o:[['Error of commission that resulted in an adverse event',0,'Commission is doing the wrong thing; here an indicated action was not done.'],['Unpreventable adverse event because the patient was off the unit',0,'The dose could have been given after the patient returned.'],['Error of omission that contributed to a preventable adverse event',1,'Correct. Failure to give an indicated drug is omission; the resulting harm was preventable.'],['Near miss, because DVT is a known postoperative complication of hip and abdominal surgery',0,'The gap in care reached the patient and harm followed.']],
r:'An error of omission is failure to perform an indicated action. Because harm followed and the dose could have been given, this is a preventable adverse event.',
trap:'"Off the unit" explains the delay, not the failure to follow up.'},
{id:'s5_02',mod:5,t:'mc',step:'EO',topic:'T1',concept:'Medical negligence: applying the standard of care',
q:'A patient on bed rest develops a stage 3 sacral pressure injury. Review shows no skin assessments or repositioning were documented for three consecutive shifts, although policy requires both. One of the nurses says, "She was so sick — there was nothing we could have done." Which response by the charge nurse is most accurate?',
o:[['"Pressure injuries are common in very ill patients, so this will most likely be classified as an unavoidable adverse event."',0,'Required preventive care was not delivered, so the injury cannot be assumed unavoidable.'],['"Because required assessments and turns were not done, care likely fell below the standard and the event needs review."',1,'Correct. Failure to meet the standard of a reasonable, prudent nurse, with resulting harm, is negligence.'],['"Since several nurses were involved over three shifts, this is a system failure and individual accountability does not apply."',0,'System factors may contribute, but nurses remain accountable for meeting the standard of care.'],['"Because the injury was found and is now being treated, it can be reported as a near miss rather than an adverse event."',0,'Harm reached the patient, so it is not a near miss.']],
r:'Negligence is care that fails to meet the standard expected of a reasonable, prudent clinician with similar training. Pressure injuries are nurse-sensitive and largely preventable, so missing required assessments and repositioning points to a standard-of-care failure.',
trap:'"The patient was very sick" does not excuse care that was required and not given.'},
{id:'s5_03',mod:5,t:'sata',step:'RC',topic:'T1',concept:'Sentinel event criteria',
q:'Which events meet criteria for a sentinel event requiring immediate investigation? Select all that apply.',
o:[['Unexpected death after a tenfold heparin overdose',1,'Unexpected death related to care.'],['Retained surgical sponge requiring a second operation',1,'Severe harm from care.'],['Antibiotic given 45 minutes late with no harm',0,'An error to report, not a sentinel event.'],['Suicide of a patient on a medical-surgical unit',1,'Death in a staffed setting is a sentinel event.'],['Mislabeled specimen caught in the lab before testing',0,'A near miss.'],['Permanent loss of function after a fall with fracture',1,'Severe, permanent harm.']],
r:'Sentinel events involve unexpected death, severe physical or psychological harm, or serious risk thereof, and require immediate investigation.',
trap:'Every sentinel event is reported, but not every reported event is sentinel.'},
{id:'s5_04',mod:5,t:'mc',step:'AC',topic:'T1',concept:'Error vs adverse event',
q:'A patient with no documented allergies develops hives and wheezing after the first dose of a correctly prescribed and administered antibiotic. After the patient is stabilized, a new nurse says, "I need to report this as a medication error." Which response by the charge nurse is accurate?',
o:[['"Yes — any harm that follows a drug we gave counts as a medication error, even when it was given exactly as ordered."',0,'An error requires a wrong or omitted action; none occurred here.'],['"Report and document the reaction, but this is an adverse event without an error, because no allergy was known."',1,'Correct. Harm from medical management can occur without any error.'],['"No report is needed, because the reaction was unexpected and no one on the team did anything incorrectly."',0,'Adverse events are still reported and documented, even when no error occurred.'],['"Classify it as a near miss, because the wheezing responded to treatment before lasting harm occurred."',0,'Harm reached the patient, so it is not a near miss.']],
r:'An adverse event is injury caused by medical management rather than the underlying condition; it can occur without any error, as with a first-time allergic reaction. It is still reported and documented.',
trap:'Adverse ≠ error. Harm can happen even when everyone did everything right — and it still gets reported.'},
{id:'s5_05',mod:5,t:'matrix',step:'AC',topic:'T1',concept:'Classifying safety events',
q:'For each event, indicate the best classification.',
cols:['Near miss','Medical error without harm','Adverse event'],
rows:[['Pharmacist intercepts a tenfold insulin order before it is dispensed',0,'Caught before reaching the patient.'],['Patient receives a double dose of an antihypertensive; vital signs remain stable',1,'Reached the patient, no harm.'],['Patient becomes hypotensive and falls after a double dose of an antihypertensive',2,'Harm from care.'],['Nurse scans the wrong wristband; the scanner alerts before administration',0,'Barrier caught the error before it reached the patient.']],
r:'Did it reach the patient? If not: near miss. If yes without harm: medical error. If harm from care: adverse event.',
trap:'"Stable vital signs" does not change an error that reached the patient into a near miss.'},
{id:'s5_06',mod:5,t:'mc',step:'GS',topic:'T8',concept:'STEEEP: Equitable (applied)',
q:'Clinic data show that Black patients with chest pain wait an average of 25 minutes longer for an ECG than white patients with the same triage acuity. Which action by the quality nurse best addresses the quality problem?',
o:[['Add a second ECG technician during peak hours so that every chest-pain patient receives an ECG faster',0,'May improve average timeliness but does not identify or close the gap between groups.'],['Break down door-to-ECG times by race and examine where in triage and workflow the gap develops',1,'Correct. The core problem is equity; the team must locate where care diverges by group.'],['Remind triage nurses that every chest-pain patient must receive an ECG within the target time',0,'Education and reminders are weak and do not address why the gap exists.'],['Report each delayed ECG as a separate incident and counsel the triage nurses involved in each case',0,'Treats a group-level pattern as individual events.']],
r:'Equitable care does not vary by gender, ethnicity, geography, socioeconomic status or other nonclinical characteristics. When care differs by group for the same clinical need, the team must stratify the data and find where the difference arises.',
trap:'A faster process for everyone can leave the gap between groups untouched.'},
{id:'s5_07',mod:5,t:'mc',step:'GS',topic:'T8',concept:'STEEEP: Effective (overuse)',
q:'A unit orders a routine daily chest x-ray for every ventilated patient, although current evidence shows this practice does not improve outcomes. Which proposal from the unit practice council best improves the quality of care?',
o:[['Batch all daily chest x-rays at 0400 so radiology can complete them with fewer trips to the unit',0,'Makes an unnecessary practice more efficient instead of stopping it.'],['Continue daily films, since extra imaging adds a margin of safety for critically ill ventilated patients',0,'Overuse is not safer; it adds radiation, cost and handling without benefit.'],['Order chest x-rays only when clinically indicated, per an evidence-based protocol, and monitor outcomes',1,'Correct. Effective care is evidence-based and avoids overuse as well as underuse.'],['Survey staff and keep whichever imaging schedule most nurses and respiratory therapists prefer',0,'Preference is not evidence.']],
r:'Effective care is evidence-based and avoids both underuse and overuse. Efficient care avoids waste such as duplicated tests caused by information not being shared. Making an unsupported practice faster does not make it effective.',
trap:'Doing an unnecessary test more efficiently is still overuse.'},
{id:'s5_08',mod:5,t:'mc',step:'TA',topic:'T8',concept:'STEEEP: Patient-centered (applied)',
q:'A patient with end-stage kidney disease who has decision-making capacity tells the team she wants conservative management and does not want dialysis. The next morning the nurse sees that dialysis catheter placement has been scheduled without any discussion with her. Which action should the nurse take?',
o:[['Prepare her for the procedure as scheduled, because dialysis is the standard treatment for her condition',0,'Proceeding disregards her stated, informed preference.'],['Ask the provider to formally reassess her capacity, since declining dialysis suggests she may not understand',0,'Disagreeing with a recommendation is not evidence of incapacity.'],['Ask her family to speak with her tonight in the hope of persuading her to agree to the catheter',0,'Pressuring her through family does not honor her values.'],['Notify the provider that she declined dialysis, hold the procedure, and arrange a discussion with her',1,'Correct. Patient-centered care honors her preferences and makes her a partner in decisions.']],
r:'Patient-centered care is responsive to patient preferences, needs and values and makes the patient a partner in decisions. The nurse advocates by stopping a plan that ignores her stated choice.',
trap:'A capable adult declining treatment is exercising autonomy, not showing incapacity.'},
{id:'s5_09',mod:5,t:'sata',step:'AC',topic:'T8',concept:'Donabedian outcome measures',
q:'A quality council reviews its dashboard. Which items are outcome measures? Select all that apply.',
o:[['30-day heart failure readmission rate',1,'A result of care.'],['RN hours per patient day',0,'Staffing is structure.'],['Hospital-acquired pressure injury rate',1,'A result of care.'],['Percentage of patients receiving discharge teaching',0,'Care delivered — process.'],['Patient-experience (HCAHPS) scores',1,'Patient experience is an outcome.'],['Hand hygiene compliance',0,'Care delivered — process.']],
r:'Structure = resources; process = care delivered; outcome = results such as readmissions, complications, mortality, experience and cost.',
trap:'Patient experience counts as an outcome.'},
{id:'s5_10',mod:5,t:'mc',step:'GS',topic:'T8',concept:'Nursing-sensitive indicators',
q:'A chief nursing officer wants to compare the quality of nursing care across medical-surgical units. Which data set is most appropriate?',
o:[['Average length of stay by attending physician, surgical case volume and operating room turnover time',0,'Reflects medical services, not nursing care.'],['Falls with injury, pressure injury rates, CAUTI rates and RN hours per patient day',1,'Correct. Measures substantially affected by nursing care.'],['Pharmacy turnaround time and laboratory specimen rejection rates',0,'Reflect other departments.'],['Physician consult response times, imaging wait times and average emergency department length of stay',0,'Not nursing-sensitive.']],
r:'Nursing-sensitive indicators are processes and outcomes substantially affected by nursing care: falls, pressure injuries, selected HAIs, and staffing/work-environment measures.',
trap:'Ask whether better nursing care would directly change the number.'},
{id:'s5_11',mod:5,t:'mc',step:'AC',topic:'T8',concept:'Value-based purchasing and HACs',
q:'A hospital\'s Medicare reimbursement is reduced after it reports high rates of stage 4 hospital-acquired pressure injuries. Which explanation is most accurate?',
o:[['The Joint Commission fines hospitals directly for each stage 3 or 4 pressure injury it finds',0,'TJC accredits; it does not set Medicare payment.'],['ISMP adjusts reimbursement based on reported events',0,'ISMP is a medication-safety organization.'],['CMS links part of reimbursement to performance on preventable conditions',1,'Correct. Value-based purchasing and HAC payment consequences.'],['National Patient Safety Goals require hospitals to refund payments for preventable complications',0,'NPSGs identify focus areas; they do not require refunds.']],
r:'Value-based purchasing links some reimbursement to quality, outcomes, experience, safety and efficiency. HACs and never events can trigger payment consequences.',
trap:'TJC = accreditation; CMS = payment; ISMP = medication safety.'},
{id:'s5_12',mod:5,t:'mc',step:'RC',topic:'T8',concept:'National Patient Safety Goals',
q:'A new nurse asks which organizational focus the National Patient Safety Goals address. Which response by the nurse educator is accurate?',
o:[['"They set the minimum nurse-to-patient staffing ratios that every accredited hospital must follow."',0,'NPSGs do not set staffing ratios.'],['"They target recurring high-risk areas, such as patient identification."',1,'Correct. NPSGs focus attention on recurring high-risk areas.'],['"They determine how much Medicare pays for each admission."',0,'Payment rules come from CMS.'],['"They replace the need for each hospital to maintain its own internal incident-reporting system."',0,'Reporting systems remain essential.']],
r:'NPSGs focus organizations on recurring high-risk areas: patient identification, communication of critical results, medication and alarm safety, infection prevention, suicide risk, and surgical verification/time-out.',
trap:'NPSGs are about focus areas, not payment or staffing.'},
{id:'s5_13',mod:5,t:'mc',step:'TA',topic:'T2',concept:'Who completes the incident report',
q:'During rounds, a UAP finds that a patient who was NPO for surgery received and ate a breakfast tray. Surgery is postponed. According to course guidelines, who should complete the incident report?',
o:[['The nurse manager, after interviewing the staff involved',0,'Managers review reports; they do not originate all of them.'],['The surgeon, because the procedure was delayed',0,'The surgeon did not identify the event.'],['Risk management, after a verbal report from the charge nurse',0,'Risk management analyzes reports.'],['The UAP who identified the event, with nurse support per policy',1,'Correct. The person who witnessed or identified the event completes the report.']],
r:'The incident report is completed by the person who witnessed or identified the incident, as soon as possible after the patient is safe.',
trap:'Reports come from firsthand knowledge, not rank.'},
{id:'s5_14',mod:5,t:'sata',step:'GS',topic:'T2',concept:'Incident report contents',
q:'A nurse is completing an incident report after giving a patient another patient\'s metoprolol. Which information should be included? Select all that apply.',
o:[['Date, time and location of the event',1,'Required factual element.'],['The nurse\'s opinion that understaffing caused the mix-up',0,'Opinion and speculative cause.'],['Names of witnesses and who was notified',1,'Required element.'],['Patient\'s condition and the actions taken',1,'Required element.'],['A recommendation that the pharmacist be disciplined',0,'Blame framed as fact.'],['An objective timeline of what happened',1,'Required element.']],
r:'Incident reports contain objective facts — date/time/location, people involved, witnesses, notifications, condition, actions and a concise timeline — and exclude opinions, blame and speculation.',
trap:'Contributing factors are explored in the RCA, not asserted in the report.'},
{id:'s5_15',mod:5,t:'mc',step:'EO',topic:'T2',concept:'Medical record rule',
q:'A charge nurse reviews documentation after a medication error. Which entry in the medical record requires follow-up?',
o:[['"1420: BP 92/54, HR 58. Provider notified at 1425; orders received."',0,'Objective and appropriate.'],['"Patient states, \'I feel dizzy when I stand.\' Assisted back to bed."',0,'A quote and intervention — appropriate.'],['"Incident report filed regarding the wrong-dose administration."',1,'Correct. The chart should never reference the incident report.'],['"Repeat vital signs at 1500: BP 108/66, HR 70. Dizziness resolved."',0,'Patient response — appropriate.']],
r:'The chart documents assessment, notifications, interventions and patient response. It never states that an incident report was completed.',
trap:'"Requires follow-up" means find the WRONG entry.'},
{id:'s5_16',mod:5,t:'mc',step:'PH',topic:'T3',concept:'Just Culture: human error in a system pattern',
q:'In one month, three different nurses programmed a new infusion pump at ten times the intended rate; each reports that the decimal display is confusing. Which response by the manager is most consistent with Just Culture?',
o:[['Require the most recent nurse to complete pump retraining',0,'An individual fix ignores a pattern across three nurses.'],['Classify the most recent error as reckless because the error was tenfold',0,'Outcome severity does not determine the behavior category.'],['Console the nurses and work with biomedical engineering to fix the display',1,'Correct. Human error → console and redesign the system.'],['Issue written warnings to all three nurses to emphasize accountability',0,'Punishing slips discourages reporting and leaves the hazard.']],
r:'Unintentional slips set up by a design flaw are human error. Just Culture consoles the individual and redesigns the system.',
trap:'Classify the behavior, not how bad the outcome was.'},
{id:'s5_17',mod:5,t:'mc',step:'AC',topic:'T3',concept:'Reckless behavior',
q:'Which nurse behavior is best classified as reckless under Just Culture?',
o:[['Pre-pouring medications for several patients at the start of the shift, a long-standing and common practice among nurses on the unit',0,'A normalized shortcut — at-risk behavior.'],['Transposing two digits while entering a patient\'s weight into the EHR during an admission with frequent interruptions',0,'An unintentional slip — human error.'],['Forgetting to restart a maintenance IV after a patient returns from CT while covering a colleague\'s patients during lunch',0,'A lapse — human error.'],['Starting an insulin drip without the required double check after a peer refuses, saying, "I know, but I don\'t have time"',1,'Correct. Conscious disregard of a recognized, substantial risk.']],
r:'Reckless behavior is conscious disregard of a substantial and unjustifiable risk. Corrective or disciplinary action may be appropriate.',
trap:'Reckless = knows the risk AND chooses it.'},
{id:'s5_18',mod:5,t:'mc',step:'GS',topic:'T3',concept:'Building psychological safety',
q:'A new graduate stays silent when a physician omits full sterile barrier precautions during a central line insertion, because a colleague was ridiculed for speaking up last month. Which action by nursing leadership would most improve psychological safety?',
o:[['Encourage new graduates to build their confidence to speak up through a formal mentoring program',0,'Places the burden on individuals rather than the environment.'],['Require that only charge nurses challenge physicians during bedside procedures, to reduce conflict',0,'Reinforces the authority gradient.'],['Install an anonymous box for staff to submit safety concerns',0,'Cannot stop harm in real time and does not change the culture.'],['Adopt a "stop the line" policy anyone can use and visibly support staff who use it',1,'Correct. Leaders create the conditions that make speaking up safe.']],
r:'Psychological safety — speaking up without humiliation or retaliation — is built through leadership, policy and visible support, not by asking individuals to be braver.',
trap:'Culture problems need leadership answers.'},
{id:'s5_19',mod:5,t:'mc',step:'TA',topic:'T4',concept:'HRO: sensitivity to operations',
q:'At 1500 a charge nurse has 20 minutes before a staffing meeting. Two patients on the unit have rising early-warning scores, and their nurse has been in an isolation room for 40 minutes. Which action by the charge nurse best reflects sensitivity to operations?',
o:[['Review last month\'s near-miss reports so the staffing meeting can address weak barriers on the unit',0,'Looking back at near misses is preoccupation with failure, and it ignores what is happening now.'],['Send a nurse to assess the two patients and help their nurse with the current workload',1,'Correct. Real-time awareness of frontline conditions, acted on before harm occurs.'],['Ask the nurse to update the scores in the EHR when she leaves the isolation room',0,'Delays response to deterioration that is happening now.'],['Bring both early-warning scores to the staffing meeting as evidence that more nurses are needed',0,'Uses the data later instead of responding to it now.']],
r:'Sensitivity to operations is continuous awareness of what is happening at the bedside, so that anomalies are noticed and acted on before they become harm.',
trap:'The best answer acts on real-time conditions now, not at a meeting later.'},
{id:'s5_20',mod:5,t:'mc',step:'GS',topic:'T4',concept:'HRO: reluctance to simplify',
q:'After several wrong-patient lab draws, a manager says, "Night shift is just careless. I\'ll write them up." Which response by the safety committee chair best reflects high-reliability thinking?',
o:[['"I agree. Accountability for labeling at the bedside rests with each nurse and phlebotomist on that shift."',0,'Accepts a simple, blame-based explanation.'],['"Let\'s retrain night shift first, since most of the reported wrong-patient draws happened on that shift."',0,'Still assumes the cause is the people on one shift.'],['"Let\'s map the labeling process on every shift to find the conditions that allow wrong-patient draws."',1,'Correct. Rejecting an easy explanation and examining the whole process is reluctance to simplify.'],['"Let\'s wait until one of these draws causes harm before we commit resources to a full analysis."',0,'HROs treat near misses and no-harm events as warnings.']],
r:'Reluctance to simplify means refusing easy single-cause or blame explanations for complex problems and looking at the conditions that produce the error.',
trap:'"They\'re careless" is a simplification; mapping the process is not.'},
{id:'s5_21',mod:5,t:'mc',step:'TA',topic:'T4',concept:'HRO: commitment to resilience',
q:'The EHR goes down unexpectedly during the 0900 medication pass, and IT estimates it will be down for 4 hours. Which action by the charge nurse best demonstrates commitment to resilience?',
o:[['Hold all scheduled medications until the EHR is restored, to avoid errors from paper documentation',0,'A 4-hour hold of all medications causes its own harm.'],['Have each nurse give medications from memory of the morning MAR to keep the pass on schedule',0,'Unsafe; no verification against current orders.'],['Ask IT for updates every 30 minutes and resume documentation in full once the system is restored',0,'Waits for recovery instead of operating safely in the meantime.'],['Switch to downtime MARs, verify active orders with pharmacy, and continue the medication pass safely',1,'Correct. Contain the disruption, recover and keep operating safely.']],
r:'Commitment to resilience is the ability to contain errors and disruptions, recover quickly, continue operating safely and learn afterward.',
trap:'Resilience means continuing safely through the disruption, not stopping or improvising.'},
{id:'s5_22',mod:5,t:'mc',step:'TA',topic:'T4',concept:'HRO: deference to expertise',
q:'During a rapid response, a patient\'s ventilator alarms repeatedly. The respiratory therapist says she recognizes the cause. Which action by the physician leading the response best reflects high-reliability principles?',
o:[['Continue directing troubleshooting personally, because the team leader is accountable for the response',0,'Rank should not override the most relevant expertise.'],['Call the attending intensivist to evaluate the ventilator before anyone makes changes to the settings',0,'Delays correction while expertise is already at the bedside.'],['Ask the respiratory therapist to lead ventilator troubleshooting while the rest of the team supports her',1,'Correct. The person with the most relevant knowledge leads, regardless of rank.'],['Silence the alarms so the team can concentrate on the assessment without repeated distraction',0,'Silencing alarms without fixing the cause hides a hazard.']],
r:'Deference to expertise means the person with the most relevant knowledge leads the response regardless of rank.',
trap:'The leader can stay accountable while handing the lead on one problem to the expert.'},
{id:'s5_23',mod:5,t:'mc',step:'GS',topic:'T6',concept:'First step in RCA',
q:'A hospital convenes an RCA team after a serious medication event. Which action should the team take first?',
o:[['Identify which staff member made the error',0,'Blaming early blocks deeper analysis.'],['Implement a new independent double-check policy',0,'Jumping to a fix skips analysis.'],['Define the problem precisely',1,'Correct. What happened, where, when, to whom and under what conditions.'],['Recommend countermeasures to leadership',0,'Countermeasures follow validated causes.']],
r:'RCA begins by defining the problem precisely, then collecting data, identifying causal factors, validating root causes, recommending countermeasures, and implementing and monitoring them.',
trap:'Understand WHAT happened before asking WHY.'},
{id:'s5_24',mod:5,t:'mc',step:'EO',topic:'T6',concept:'RCA mistake: skipping analysis',
q:'After a cluster of CAUTIs, a manager immediately switches to a new catheter brand. Two months later rates are unchanged. What most likely went wrong?',
o:[['RCA methods do not apply to infection-related problems',0,'RCA applies to any undesired outcome.'],['Two months is too short a period to see any meaningful change in the unit\'s infection rates',0,'The data show no improvement; the issue is the untested assumption.'],['The nurses who inserted and maintained the catheters were not held individually accountable',0,'Punitive and still not based on validated causes.'],['A countermeasure was chosen before the problem and root causes were validated',1,'Correct. Skipping analysis risks fixing the wrong thing.']],
r:'RCA order: define → collect data → causal factors → validated root causes → countermeasures → implement and monitor. Jumping to a solution often misses the real cause.',
trap:'Validate before you fix.'},
{id:'s5_25',mod:5,t:'mc',step:'AC',topic:'T6',concept:'"Forgot" is not a root cause',
q:'An RCA team concludes, "The nurse forgot to check the allergy band." Which next step is most appropriate?',
o:[['Ask why the allergy information was easy to miss and what system factors contributed',1,'Correct. Keep asking why until reaching system causes.'],['Accept the conclusion and close the RCA',0,'Stopping at a person is a common RCA mistake.'],['Require the nurse to review and sign the allergy-verification policy before returning to work',0,'Relies on memory — a weak fix.'],['Suspend the nurse pending further review of her medication administration practices',0,'Punitive response to a likely human error.']],
r:'"Forgot," "careless" or "didn\'t pay attention" are not adequate root causes. Ask what conditions made the error possible.',
trap:'Any answer naming one person as the root cause is suspect.'},
{id:'s5_26',mod:5,t:'cloze',step:'AC',topic:'T6',concept:'5 Whys chain from the PowerPoint',
q:'Complete the 5 Whys chain from the PowerPoint fall example by choosing from the lists of options.',
text:'The patient fell → got up unassisted → no one answered the call light → the nurse had delegated call-light response to the UAP → {0} → root cause: {1}.',
blanks:[[['the UAP was overloaded with too many patients','the patient did not remember to use the call light','the bed alarm had not been turned on that shift'],0,'The next "why" in the slide chain.'],[['a unit culture that accepted unsafe workload','the UAP\'s need for more call-light training','inadequate patient teaching about fall risk'],0,'The deepest system cause in the slide example.']],
r:'The 5 Whys drills from the visible event to the deeper system cause; the slide chain ends at a negative unit culture that accepted unsafe workload.',
trap:'The chain should end at a system or culture cause, not a person.'},
{id:'s5_27',mod:5,t:'mc',step:'GS',topic:'T6',concept:'Strongest countermeasure',
q:'After three events in which enteral feeding tubing was connected to IV lines, which countermeasure is strongest?',
o:[['Require a second nurse to independently verify and document every tubing connection',0,'Helpful but still relies on vigilance.'],['Label all enteral tubing and feeding pumps with bright orange warning stickers',0,'Labels are easily overlooked.'],['Adopt enteral connectors that physically cannot connect to IV ports',1,'Correct. A forcing function makes the error impossible.'],['Post warning signs in every medication room',0,'Staff habituate to signs.']],
r:'Forcing functions and design changes are stronger than double checks, labels, signs or education because they do not depend on human vigilance.',
trap:'If an option makes the error physically impossible, it wins.'},
{id:'s5_28',mod:5,t:'mc',step:'EO',topic:'T7',concept:'PDSA: Study before Act',
q:'A QI team predicted that a new medication-pass checklist would cut missed doses by half. One nurse tested it on day shift for one week; missed doses fell from 6 to 4, and she reports that two checklist steps did not fit the workflow. What should the team do next?',
o:[['Adopt the checklist unit-wide now, because missed doses decreased during the first test',0,'Skips Study; one small test that missed its prediction does not justify spread.'],['Abandon the checklist, because it did not achieve the predicted 50% reduction in missed doses',0,'An Act decision made without studying why; the change may only need adapting.'],['Compare the results with the prediction and review the two problem steps before deciding',1,'Correct. Study compares results with the prediction and examines what was learned.'],['Repeat the identical test on all three shifts at once to gather a larger sample before review',0,'Expanding an unrevised test skips learning from the first cycle.']],
r:'PDSA: Plan (change, prediction, data), Do (run a small test), Study (compare results with the prediction and learn), Act (adopt, adapt or abandon). Study comes before any decision.',
trap:'Results that differ from the prediction are information to study, not an automatic pass or fail.'},
{id:'s5_29',mod:5,t:'mc',step:'GS',topic:'T7',concept:'Pareto chart (applied)',
q:'A falls committee has data on nine contributing factors for 60 falls this year, but funding for only two interventions. Which approach best guides the committee\'s decision?',
o:[['Plot total monthly falls on a run chart to see whether the unit trend is rising or falling',0,'Shows change over time but does not show which factors contribute most.'],['Spread the funding across all nine factors so that no contributing factor is overlooked',0,'Diluting resources ignores the "vital few."'],['Fund the two interventions that staff rate as the easiest to put in place on the unit',0,'Ease does not tell the team where most falls come from.'],['Rank the nine factors by frequency in a Pareto chart and target the few that account for most falls',1,'Correct. A Pareto chart identifies the vital few factors to focus limited resources on.']],
r:'A Pareto chart ranks problem categories from most to least frequent so a team can focus on the "vital few" that account for most of the problem.',
trap:'Limited resources plus many causes calls for ranking the causes first.'},
{id:'s5_30',mod:5,t:'mc',step:'TA',topic:'T7',concept:'Clinical pathway variance',
q:'A patient on the total knee replacement clinical pathway is expected to walk in the hallway on post-op day 1. When the nurse sits him up, his BP drops from 128/74 to 94/56 and he reports dizziness. Which action should the nurse take?',
o:[['Walk him in the hallway as scheduled, because the pathway requires day-1 ambulation for all patients',0,'A pathway allows justified variance; walking an orthostatic patient risks a fall.'],['Return him to bed, notify the provider, and document the variance and its reason on the pathway',1,'Correct. Pathways standardize care but allow justified variance, which must be documented.'],['Take him off the pathway, because its expected sequence of care no longer applies to this patient',0,'One variance does not remove the patient from the pathway.'],['Skip walking today and move him to the day-2 pathway goals tomorrow without notifying the provider',0,'Orthostatic hypotension needs evaluation, and the variance must be documented.']],
r:'A clinical (critical) pathway standardizes the expected sequence and timing of care for a defined condition while allowing justified variance; variances are documented and addressed, not ignored or forced.',
trap:'"Standardized" does not mean "mandatory regardless of the patient\'s condition."'},
{id:'s5_31',mod:5,t:'sata',step:'GS',topic:'T7',concept:'Characteristics of a strong QI approach',
q:'A staff nurse notices that discharges are delayed until late afternoon because medication reconciliation is not completed until the day of discharge. Which actions reflect an effective nursing contribution to quality improvement? Select all that apply.',
o:[['Collect baseline data on discharge times and reconciliation timing',1,'Establishes a baseline.'],['Bring the data to the unit practice council',1,'Engages shared governance.'],['Propose a small test of change on one hallway',1,'Small, rapid PDSA test.'],['Begin doing reconciliation her own new way for all patients',0,'Unilateral and untested.'],['File an incident report for every delayed discharge',0,'Misuses incident reporting.'],['Wait for the manager to identify a solution',0,'Passive; no contribution.']],
r:'Nurses drive QI by measuring baseline performance, engaging the team through shared governance, and testing small changes with PDSA.',
trap:'Good QI starts with data and a small test — not complaints or unilateral change.'},
{id:'s5_32',mod:5,t:'mc',step:'TA',topic:'T9',concept:'Technology: no workarounds',
q:'The BCMA scanner reads "Patient not found" when the nurse scans a patient she has cared for over three days. Which action should the nurse take?',
o:[['Override the alert, because the patient\'s identity is certain',0,'Familiarity is not verification.'],['Scan the spare wristband label kept in the MAR binder',0,'A workaround that verifies a label, not the patient.'],['Give the dose on time and ask the next shift to replace the wristband',0,'Bypasses verification and passes on the hazard.'],['Hold the dose, verify identity per policy, fix the wristband and report the problem',1,'Correct. Repair the barrier, follow policy, report the hazard.']],
r:'Technology reduces error but creates new failure modes and never replaces judgment. Follow the approved process and report technology problems rather than inventing workarounds.',
trap:'Workarounds are at-risk behavior, even when the nurse "knows" the patient.'},
{id:'s5_33',mod:5,t:'mc',step:'TA',topic:'T9',concept:'Alarm fatigue',
q:'A nurse notices that smart-pump alerts fire so often that staff override them without reading. Which action is most appropriate?',
o:[['Override the alerts as experienced peers do, so the medication pass stays on time for all patients',0,'Normalizing a workaround is at-risk behavior.'],['Follow the approved process for each alert and report the alert-fatigue hazard',1,'Correct. Use the system safely and escalate the hazard.'],['Ask biomedical engineering to disable the low-priority alerts on all of the unit\'s infusion pumps',0,'Removing a safety feature creates a latent failure.'],['Infuse medications by gravity until the alerts are fixed',0,'An unsafe workaround.']],
r:'Alert fatigue is a technology-created risk. Nurses use alerts as designed and report the hazard so the system can be improved.',
trap:'Disabling the alert solves the annoyance and creates a bigger hole.'},
{id:'s5_34',mod:5,t:'mc',step:'RC',topic:'T9',concept:'Failure to rescue',
q:'Which situation best illustrates failure to rescue?',
o:[['A patient develops a PE despite correct prophylaxis; the RRT arrives within minutes',0,'Complications can occur despite good care; rescue was timely.'],['A patient falls without injury while ambulating with a walker',0,'A fall event, not failure to rescue.'],['Over 6 hours, rising RR, falling SpO2 and new confusion are charted but never escalated',1,'Correct. Documented deterioration was not acted on.'],['A patient declines early ambulation after abdominal surgery and receives teaching about the risks',0,'Autonomy with appropriate teaching.']],
r:'Failure to rescue is failing to recognize or respond to deterioration in time. Trending data and prompt escalation prevent it.',
trap:'Documenting deterioration is not the same as acting on it.'},
{id:'s5_35',mod:5,t:'sata',step:'GS',topic:'T9',concept:'Patient and family engagement',
q:'Which nursing actions engage patients and families as partners in safety? Select all that apply.',
o:[['Invite patients to ask caregivers, "Did you clean your hands?"',1,'Empowers patients to speak up.'],['Tell patients there is no need to question medications because nurses double-check them',0,'Discourages patients from acting as safety partners.'],['Encourage patients to keep an updated home medication list',1,'Supports reconciliation.'],['Offer to include the patient in bedside shift report',1,'Patients can catch errors and add information.'],['Ask family members to silence and reset IV pump alarms',0,'Inappropriate delegation of a clinical task.'],['Encourage families to report changes they notice in the patient',1,'Families often notice early deterioration.']],
r:'Patients and families are safety partners in identification, medication accuracy, infection prevention, handoffs and early recognition of change.',
trap:'Engagement invites patients to speak up — never tells them not to question care.'},
{id:'s5_36',mod:5,t:'mc',step:'PH',topic:'T5',concept:'Pattern across staff → system analysis',
q:'A manager says, "We had four medication errors this month — four different nurses, all during the 0900 med pass. I\'ll counsel each nurse." Which response by the quality nurse is best?',
o:[['"The pattern suggests a 0900 process problem; let\'s look at interruptions, workload and delivery timing."',1,'Correct. Different people, same process → look at the process.'],['"That makes sense — each nurse is professionally accountable for her own medication errors and should be counseled."',0,'Individual counseling ignores the pattern.'],['"We should take those four nurses off medication duty for now until each completes a remediation plan."',0,'Punitive, and the hazard remains.'],['"Since none of the four errors caused patient harm, no further action is needed beyond documenting them."',0,'No-harm errors are valuable safety data.']],
r:'When different people make similar errors in the same process, latent conditions are likely. Systems thinking asks which defenses failed and why.',
trap:'Different people + same time/process = system problem.'},
{id:'s5_37',mod:5,t:'mc',step:'RC',topic:'T1',concept:'Why patient safety became a national priority',
q:'A nursing student asks why patient safety became a national priority. Which response by the instructor is most accurate?',
o:[['"The Joint Commission was created in 1999 specifically to reduce the number of malpractice claims."',0,'Inaccurate history.'],['"QSEN required all hospitals to report every error to CMS."',0,'QSEN defines competencies; it is not a reporting mandate.'],['"National Patient Safety Goals data showed that individual nurses caused most of the preventable errors."',0,'Contradicts the systems view of safety.'],['"The IOM report To Err Is Human estimated more than 98,000 preventable deaths each year."',1,'Correct. The landmark report that accelerated national attention.']],
r:'The IOM report To Err Is Human (1999) accelerated national attention to preventable harm, highlighting more than 98,000 preventable deaths per year.',
trap:'Know the landmark report and its headline number.'},
{id:'s5_38',mod:5,t:'mc',step:'EO',topic:'T5',concept:'QSEN definition of safety (applied)',
q:'After a near miss, a new nurse tells her preceptor, "For me, being safe means I just can\'t ever make a mistake." Which response by the preceptor best reflects the QSEN definition of safety?',
o:[['"That\'s right — careful, error-free performance by each nurse is what keeps our patients safe."',0,'Keeps only the individual half and ignores systems.'],['"Safety depends on the system and on your own practice — both protect patients and staff."',1,'Correct. QSEN: minimize harm to patients and providers through system effectiveness and individual performance.'],['"Mistakes are the system\'s fault, so your own practice isn\'t really what determines safety."',0,'Keeps only the system half and removes individual accountability.'],['"Safety is mostly about protecting the hospital from liability after an adverse event happens."',0,'That describes one goal of risk management, not the QSEN definition.']],
r:'QSEN defines safety as minimizing risk of harm to patients and providers through both system effectiveness and individual performance.',
trap:'Options that keep only one half (systems OR individuals) are incomplete.'},
{id:'s5_39',mod:5,t:'matrix',step:'GS',topic:'T9',concept:'Matching preventable risks to nursing actions',
q:'For each preventable risk, indicate the nursing action most directly aimed at preventing it.',
cols:['Toileting rounds and orthostatic precautions','Daily device-necessity review','Repositioning and moisture management','Trend vital signs and escalate early'],
rows:[['Falls',0,'Address toileting needs and postural hypotension.'],['CAUTI',1,'Remove catheters as soon as they are no longer indicated.'],['Pressure injury',2,'Offload pressure and manage moisture.'],['Failure to rescue',3,'Recognize and respond to deterioration early.']],
r:'Each preventable inpatient risk has targeted bedside prevention: falls (toileting, orthostatic management), HAIs (device necessity), pressure injury (offloading, moisture, nutrition) and failure to rescue (trending and escalation).',
trap:'Match the action to the mechanism of harm.'});

/* ===== STANDALONE ITEMS — MODULE 6 (21) ===== */
Q.push(
{id:'s6_01',mod:6,t:'mc',step:'TA',topic:'T13',concept:'Overcoming an authority gradient',
q:'A new nurse notices that a morphine order is ten times the usual dose. The attending who wrote it is known for belittling nurses who call with questions. Which action should the nurse take?',
o:[['Give the usual dose instead of the ordered amount, then clarify the order with the attending in the morning',0,'Changing an order on her own is outside her scope and is still an unclarified order.'],['Give the dose as ordered, because the attending is responsible for any error in the prescription',0,'Nurses are accountable for the medications they give.'],['Hold the dose and call the attending to clarify, using the chain of command if it is not resolved',1,'Correct. Patient safety outweighs the authority gradient; escalate if needed.'],['Ask a senior nurse to call the attending later, because he responds better to experienced staff',0,'Delays clarification and reinforces the hierarchy.']],
r:'An authority gradient discourages lower-status members from speaking up. The nurse must still hold a questionable high-alert medication and clarify it, escalating through the chain of command when needed.',
trap:'Fear of a person never justifies giving, or changing, an order you believe is unsafe.'},
{id:'s6_02',mod:6,t:'mc',step:'GS',topic:'T13',concept:'Preventing filtration',
q:'A charge nurse, juggling two phone calls during report, later realizes she never heard that a patient\'s potassium was critically low. Which change would best prevent this from happening again?',
o:[['Have off-going nurses email critical values to the charge nurse after report is finished',0,'Delays critical information and adds another channel to miss.'],['Remind the charge nurse during her evaluation to concentrate more closely during report',0,'Relies on individual vigilance without changing the conditions.'],['Ask the charge nurse to write shorter notes so that she can listen more closely in report',0,'Does not remove the competing phone calls.'],['Give report in a quiet area free of phone calls, with read-back of all critical values',1,'Correct. Removing distraction and using check-back prevent filtration.']],
r:'Filtration is unconscious screening-out of information, made more likely by noise, multitasking, stress and fatigue. Reducing distractions and using check-back help prevent it.',
trap:'Filtration is fixed by changing the conditions, not by asking someone to try harder.'},
{id:'s6_03',mod:6,t:'mc',step:'TA',topic:'T13',concept:'Therapeutic response to incongruent cues',
q:'A post-op patient says, "I\'m fine," while grimacing and guarding the incision. Which response by the nurse is best?',
o:[['"Are you sure you don\'t want something for pain?"',0,'A closed, leading question.'],['"You say you\'re fine, but you\'re holding your incision. Tell me how you\'re feeling."',1,'Correct. Names the incongruence and invites more information.'],['"Great — let me know if anything changes."',0,'Accepts words and ignores nonverbal cues.'],['"Most people have some pain the first day after surgery."',0,'Generalizing minimizes the patient\'s experience.']],
r:'When verbal and nonverbal messages conflict, assess the incongruence with an open-ended prompt.',
trap:'The nonverbal message often carries more weight — explore it.'},
{id:'s6_04',mod:6,t:'mc',step:'TA',topic:'T13',concept:'Avoiding false reassurance',
q:'A patient scheduled for surgery says, "I\'m terrified I won\'t wake up from the anesthesia." Which response by the nurse is most therapeutic?',
o:[['"Your anesthesiologist is excellent and very experienced, so there\'s really no need to worry."',0,'False reassurance.'],['"It sounds like the anesthesia worries you. What concerns you most?"',1,'Correct. Validates and explores.'],['"Let\'s go over your discharge plans so you have something to look forward to."',0,'Blocking — changes the subject.'],['"Serious complications from modern general anesthesia are extremely rare in healthy adults."',0,'Minimizes the concern instead of exploring it.']],
r:'Therapeutic responses validate emotion and use open-ended questions; false reassurance and blocking shut down communication.',
trap:'Facts offered too early ("extremely rare") can still be dismissive.'},
{id:'s6_05',mod:6,t:'mc',step:'EO',topic:'T13',concept:'Negative stem: assertive communication',
q:'A nurse educator reviews communication styles with new graduates. Which statement by a new graduate indicates a need for further teaching?',
o:[['"Assertive communication protects my rights while respecting others."',0,'Accurate.'],['"Passive communication can let safety concerns go unspoken."',0,'Accurate.'],['"Being aggressive is acceptable when I am sure I am right."',1,'Correct. Aggressive communication impairs teamwork even when the concern is valid.'],['"Passive-aggressive behavior undermines trust on a team."',0,'Accurate.']],
r:'Assertive communication is the professional standard. Aggressive communication creates fear and defensiveness regardless of whether the speaker is correct.',
trap:'"Needs further teaching" means find the INCORRECT statement.'},
{id:'s6_06',mod:6,t:'mc',step:'TA',topic:'T13',concept:'Responding to a red herring',
q:'When a nurse raises a concern about unsafe staffing at a staff meeting, the manager responds, "Let\'s talk about the new parking garage instead — it\'s been a big problem." Which response by the nurse is most effective?',
o:[['"That\'s a fair concern too, so let\'s discuss the garage now and come back to staffing next time."',0,'Accepts the diversion and drops the safety issue.'],['"Parking matters, but I\'d like to finish the staffing issue first, because it affects patient safety."',1,'Correct. Acknowledges, then respectfully redirects to the real issue.'],['"You\'re just changing the subject because you don\'t want to deal with staffing on this unit."',0,'Accusatory; attacks motive instead of redirecting.'],['Say nothing more in the meeting and raise the staffing concern again at next month\'s meeting',0,'Passive; an unsafe condition goes unaddressed for a month.']],
r:'A red herring introduces an irrelevant topic to divert attention from the real problem. An assertive response acknowledges it briefly and returns to the issue that matters.',
trap:'Assertive redirection is neither giving in nor accusing.'},
{id:'s6_07',mod:6,t:'mc',step:'AC',topic:'T10',concept:'SBAR Assessment',
q:'A patient who is post-op day 2 from a total hip replacement, with a history of COPD and heart failure, has SpO2 that fell from 95% to 88%, new crackles in both bases and a 2-kg weight gain since surgery. Which statement is the best Assessment in the nurse\'s SBAR call to the provider?',
o:[['"He\'s post-op day 2 from a hip replacement and has a history of both COPD and heart failure."',0,'This is Background.'],['"I\'m calling about Mr. Hall in 412 because his oxygen saturation has dropped to 88 percent."',0,'This is Situation.'],['"I\'d like you to evaluate him now and consider a chest x-ray and a dose of IV furosemide."',0,'This is Recommendation.'],['"With the crackles and weight gain, I think he is going into fluid overload and is getting worse."',1,'Correct. Assessment is the nurse\'s interpretation, supported by findings.']],
r:'SBAR: Situation (who and the immediate concern), Background (pertinent history), Assessment (the nurse\'s interpretation of the findings), Recommendation (the specific action requested).',
trap:'Assessment interprets the data; it is not a restatement of history or a request.'},
{id:'s6_08',mod:6,t:'mc',step:'TA',topic:'T11',concept:'Closed-loop communication in a code',
q:'During a code, the team leader says, "Maria, give 1 mg epinephrine IV push." Which response by Maria best demonstrates closed-loop communication?',
o:[['"Got it, giving it now." She draws up the medication and gives it as the leader requested.',0,'Acknowledges but does not verify specifics.'],['She nods and gives the medication.',0,'Nonverbal acknowledgment leaves the loop open.'],['"Okay — someone draw it up for me."',0,'Hands off the task without clear assignment.'],['"Epinephrine 1 mg IV push." Then, after giving it: "Epinephrine is in."',1,'Correct. Repeats back, then confirms completion.']],
r:'Check-back: the receiver repeats the message and the sender verifies it; announcing completion closes the loop.',
trap:'Acknowledging is not checking back — the specifics must be repeated.'},
{id:'s6_09',mod:6,t:'mc',step:'AC',topic:'T11',concept:'I-PASS component',
q:'Which statement during an I-PASS handoff represents "situation awareness and contingency planning"?',
o:[['"If his systolic drops below 90, give the ordered bolus and call the resident."',1,'Correct. Anticipates what might happen and what to do.'],['"He\'s a watcher tonight."',0,'Illness severity.'],['"Admitted 2 days ago with pancreatitis; pain controlled on a PCA."',0,'Patient summary.'],['"So I\'ll recheck his lipase at 0400 — correct?"',0,'Synthesis by receiver.']],
r:'I-PASS = Illness severity, Patient summary, Action list, Situation awareness and contingency planning, Synthesis by receiver.',
trap:'"If/then" = contingency; receiver restating = synthesis.'},
{id:'s6_10',mod:6,t:'sata',step:'GS',topic:'T11',concept:'Bedside handoff best practices',
q:'Which practices improve the safety of bedside shift handoff? Select all that apply.',
o:[['Use a standardized tool such as I-PASS',1,'Reduces omissions.'],['Give report in the hallway outside the busy nurses\' station to save time',0,'Noise and interruptions promote filtration and privacy risks.'],['Allow the receiving nurse to ask questions and summarize key actions',1,'Synthesis closes the loop.'],['Verify infusions, drains and lines together at the bedside',1,'Catches discrepancies.'],['Exclude the patient so report goes faster',0,'Patients are safety partners.'],['Include pending labs, tests and consults',1,'Pending items are commonly lost.']],
r:'Safe handoffs transfer information, authority and responsibility using a standardized structure, interactive questioning, bedside verification and inclusion of pending items and the patient.',
trap:'Faster is not safer when it adds distraction or removes verification.'},
{id:'s6_11',mod:6,t:'sata',step:'RC',topic:'T12',concept:'STEP situation monitoring',
q:'A charge nurse uses STEP to monitor the unit. Which observations fit STEP? Select all that apply.',
o:[['A patient\'s trending blood pressure and new medications',1,'Status of patient.'],['A nurse who seems fatigued and behind on tasks',1,'Team members.'],['A broken patient lift and a full ED holding area',1,'Environment.'],['The charge nurse\'s own hunger and lack of sleep',0,'Self-readiness is I\'M SAFE, not STEP.'],['Whether today\'s discharge goals are on track',1,'Progress toward goal.']],
r:'STEP = Status of patient, Team members, Environment, Progress toward goal. Checking one\'s own readiness is I\'M SAFE.',
trap:'STEP scans the situation; I\'M SAFE scans yourself.'},
{id:'s6_12',mod:6,t:'mc',step:'TA',topic:'T12',concept:'I\'M SAFE: acting on the self-check',
q:'At the start of her shift, a nurse has flu-like symptoms, slept 3 hours and has not eaten since yesterday. She is assigned two high-acuity patients, and the unit is short one nurse. Which action should the nurse take?',
o:[['Accept the assignment but ask a teammate to double-check all of her high-alert medications',0,'A double check does not make an impaired nurse safe for a high-acuity load.'],['Accept the assignment, because leaving the unit short would put more patients at risk',0,'Working while impaired is a patient-safety risk too.'],['Tell the charge nurse she is not fit to safely take a high-acuity assignment today',1,'Correct. I\'M SAFE identifies illness, fatigue and not eating; she must speak up.'],['Accept the assignment and plan to eat and rest during her scheduled lunch break',0,'Her impairment affects care from the first hour.']],
r:'I\'M SAFE (Illness, Medication, Stress, Alcohol/drugs, Fatigue, Eating/elimination) is a self-check of readiness. When the check fails, the nurse reports it so that the assignment can be adjusted.',
trap:'Short staffing does not make an impaired nurse safe.'},
{id:'s6_13',mod:6,t:'mc',step:'TA',topic:'T12',concept:'STAR applied',
q:'A nurse is about to hang IV potassium chloride 20 mEq/100 mL when a family member interrupts with a question. Which nurse action best demonstrates the STAR technique?',
o:[['Answers the question, then starts the infusion at the ordered rate and documents it right away',0,'No pause to re-verify after an interruption, and no review afterward.'],['Answers, pauses to recheck the dose and rate, starts the pump, then checks the site and rhythm',1,'Correct. Stop, Think, Act, Review.'],['Starts the infusion first so she does not forget it, then answers the family member\'s question',0,'Rushing a high-alert action to avoid forgetting skips Stop and Think.'],['Asks a colleague to hang the infusion while she answers, then documents it as given by herself',0,'An unsafe handoff and inaccurate documentation.']],
r:'STAR (Stop, Think, Act, Review) is a pause before one\'s own high-risk action, with verification afterward — especially valuable after an interruption.',
trap:'Look for the pause before AND the check after.'},
{id:'s6_14',mod:6,t:'mc',step:'EO',topic:'T13',concept:'Formative feedback',
q:'Which feedback statement from a preceptor best reflects formative feedback?',
o:[['"You\'re careless with handoffs and need to focus much harder if you want to finish orientation on time."',0,'Targets a personal trait.'],['"Your report was really not good today."',0,'Vague and not improvement-directed.'],['"Everyone on the unit knows you tend to forget things, so please write everything down from now on."',0,'Personal and humiliating.'],['"In today\'s handoff the new oxygen need was left out; include it next time so the receiver can respond."',1,'Correct. Specific, behavior-focused, improvement-directed and patient-focused.']],
r:'Good feedback is appreciative, timely, respectful, specific, improvement-directed, considerate and patient-focused — targeting behavior, not traits.',
trap:'Specific behavior + why it matters for the patient = formative.'},
{id:'s6_15',mod:6,t:'cloze',step:'TA',topic:'T10',concept:'Advocacy and assertion',
q:'A patient\'s potassium is 6.4 mEq/L with peaked T waves, and an oral potassium supplement is still scheduled. Complete the nurse\'s statement to the provider by choosing from the lists of options.',
text:'"Dr. Lee, this is Ana on 4 West. {0} I\'d like to {1} Can we agree on that?"',
blanks:[[['I\'m concerned about Mrs. Ruiz — her potassium is 6.4 with peaked T waves.','Just letting you know her potassium came back a little high.','Her labs are back, and her potassium is a bit elevated today.'],0,'States the concern and the problem with data.'],[['hold her potassium supplement and get orders to treat the hyperkalemia now.','recheck her potassium in 4 hours before deciding anything.','give the supplement as ordered and recheck in the morning.'],0,'Offers a specific solution.']],
r:'Advocacy and assertion: make an opening, state the concern, state the problem, offer a solution and reach agreement. Firm and respectful — not minimizing, not aggressive.',
trap:'Assertive ≠ aggressive. Look for "I\'m concerned" plus a proposed solution.'},
{id:'s6_16',mod:6,t:'mc',step:'TA',topic:'T10',concept:'Two-Challenge Rule',
q:'A nurse tells a provider that a post-op patient may be bleeding internally. The provider continues charting without responding. Under the Two-Challenge Rule, which action should the nurse take next?',
o:[['Activate the chain of command immediately by calling the nursing supervisor',0,'The rule first calls for a second, assertive challenge.'],['Wait for the next scheduled rounds to raise the concern again with the full team',0,'Unsafe delay.'],['Assertively restate the concern and ensure it is acknowledged',1,'Correct. The second challenge.'],['Document the provider\'s lack of response in the patient\'s medical record',0,'Inappropriate and does not protect the patient.']],
r:'Two-Challenge Rule: state the concern; if ignored, assertively restate it and ensure acknowledgment. If still unresolved with danger persisting, escalate through the chain of command.',
trap:'Escalating after only one attempt skips a step in the rule.'},
{id:'s6_17',mod:6,t:'mc',step:'TA',topic:'T13',concept:'Applying DESC to team conflict',
q:'Two nurses repeatedly argue over who restocks the shared supply cart, and the tension is affecting teamwork. No patient is in immediate danger. Which statement by one nurse to the other is most effective?',
o:[['"I\'m stopping the line — the cart is a safety issue, and we need the manager to come in right now."',0,'A safety-escalation tool used for a non-urgent conflict.'],['"When the cart is empty at shift start, I fall behind. Could we set a restock schedule we both follow?"',1,'Correct. Describe, Express, Suggest and seek Consensus (DESC).'],['"Fine, I\'ll just restock it myself every time — it really isn\'t worth arguing about anymore."',0,'Passive accommodation leaves the conflict unresolved.'],['"You never restock the cart, and honestly everyone on the unit has noticed how lazy that is."',0,'Aggressive; attacks the person.']],
r:'DESC (Describe, Express, Suggest, Consequences/Consensus) resolves interpersonal or team conflict constructively. CUS and the Two-Challenge Rule are safety escalation tools.',
trap:'No imminent danger → conflict-resolution approach, not escalation.'},
{id:'s6_18',mod:6,t:'mc',step:'TA',topic:'T14',concept:'Culturally responsive decision-making',
q:'A patient from a culture in which elders often lead family health decisions repeatedly turns to her eldest son when asked about a treatment choice. Which action should the nurse take?',
o:[['Direct all future teaching to the son',0,'Excludes the patient from her own care.'],['Ask how she prefers decisions to be made and whom to involve, while confirming her consent',1,'Correct. Assess rather than assume; protect autonomy.'],['Remind her that, as a competent adult, she is legally required to make her own treatment decisions',0,'Disregards her preference to involve family.'],['Document that the patient lacks decision-making capacity and notify the provider for an evaluation',0,'A cultural preference is not incapacity.']],
r:'Culturally responsive communication asks about preferences (decision roles, family involvement) rather than assuming, while still ensuring the patient\'s own consent.',
trap:'Never equate a cultural practice with incapacity.'},
{id:'s6_19',mod:6,t:'sata',step:'GS',topic:'T14',concept:'Disability adaptations',
q:'A patient who is Deaf and uses American Sign Language is admitted for surgery. Which actions are appropriate? Select all that apply.',
o:[['Arrange a qualified ASL interpreter for consent and teaching',1,'Required for accurate communication.'],['Speak loudly and slowly so the patient can lip-read',0,'Lip-reading is unreliable; volume is not an adaptation.'],['Face the patient and speak directly to them',1,'Respectful and supports visual cues.'],['Assume a family member should make the decisions',0,'Disability does not imply incapacity.'],['Confirm understanding with teach-back through the interpreter',1,'Verifies comprehension.'],['Allow extra time for communication',1,'An appropriate adaptation.']],
r:'Patients with disabilities require communication adaptations — not assumptions about intelligence or decision-making ability.',
trap:'Adaptation, not assumption.'},
{id:'s6_20',mod:6,t:'mc',step:'EO',topic:'T14',concept:'Objective documentation and privacy',
q:'A charge nurse reviews a new nurse\'s practice. Which action by the new nurse requires follow-up?',
o:[['Charting "Patient pacing, fists clenched; stated, \'Nobody tells me anything.\'"',0,'Objective and appropriate.'],['Opening a friend\'s chart to check on her after surgery',1,'Correct. Unauthorized access is a privacy breach even if nothing is shared.'],['Discussing a patient\'s plan with the pharmacist in a private workroom',0,'Appropriate, need-to-know communication.'],['Verifying copied-forward assessment data before signing',0,'Appropriate EHR practice.']],
r:'Access only records needed for your role; curiosity access is an ethical and legal breach. Documentation should be objective, and copied-forward data must be verified.',
trap:'"Requires follow-up" = find the unsafe action.'},
{id:'s6_21',mod:6,t:'mc',step:'EO',topic:'T15',concept:'Interorganizational collaboration and population health',
q:'A public health nurse partners with local churches, a federally qualified health center and the county transit authority to raise colorectal cancer screening rates in a rural county. Which statement best explains how this improves population health?',
o:[['It shifts accountability for the county\'s screening rates from the health center to the transit authority',0,'Collaboration shares responsibility rather than shifting it.'],['It replaces the need for individual patient education about colorectal cancer screening at clinic visits',0,'Population efforts complement individual care.'],['It mainly lowers costs for the local hospital system',0,'Not the primary mechanism or goal.'],['It pools resources across organizations to address barriers no single organization could solve alone',1,'Correct. Interorganizational collaboration reaches access and trust barriers.']],
r:'Interorganizational collaboration (coalitions, community partnerships) shares responsibility and resources to address population-level barriers such as transportation and trust.',
trap:'Collaboration SHARES responsibility — it never transfers it.'});
</script>
<script>
(function(){
'use strict';
/* ---------- normalize data ---------- */
Q.forEach(q=>{if(q.o)q.o=q.o.map((x,i)=>[x[0],+x[1],x[2]||(q.why||[])[i]||'']);});
const QM={};Q.forEach(q=>QM[q.id]=q);
/* matrix rows: fixed, non-patterned order so the key never reads 0-1-2-3 down the grid */
(function(){function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function hs(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  const sorted=k=>k.every((v,i)=>i===0||v>=k[i-1])||k.every((v,i)=>i===0||v<=k[i-1]);
  Q.forEach(q=>{if(q.t!=='matrix')return;const r=mb(hs(q.id+'|rows'));const orig=q.rows.slice();
    for(let tries=0;tries<200;tries++){const rows=orig.slice();for(let i=rows.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[rows[i],rows[j]]=[rows[j],rows[i]];}
      const k=rows.map(x=>x[1]);const run=k.some((v,i)=>i>=2&&((v===k[i-1]&&v===k[i-2])||(v===k[i-1]+1&&k[i-1]===k[i-2]+1)||(v===k[i-1]-1&&k[i-1]===k[i-2]-1)));
      if(!sorted(k)&&!run){q.rows=rows;break;}}});})();
const KEY='hauntedExam120_v2';
const $=s=>document.querySelector(s);
const app=$('#app');
const LET=i=>String.fromCharCode(65+i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TYPE={mc:'Multiple choice',sata:'SATA',matrix:'Matrix (NGN)',cloze:'Drop-down cloze (NGN)'};
const multi=q=>q.t==='matrix'||q.t==='cloze';
const nParts=q=>q.t==='matrix'?q.rows.length:q.t==='cloze'?q.blanks.length:0;

/* ---------- default order: 6 standalone items, then a full case, repeated ---------- */
const DEFAULT_ORDER=(()=>{const s5=Q.filter(q=>!q.cs&&q.mod===5).map(q=>q.id),s6=Q.filter(q=>!q.cs&&q.mod===6).map(q=>q.id);
  const stand=[];let i5=0,i6=0;const tot=s5.length+s6.length;
  for(let k=0;k<tot;k++){const want6=Math.round((k+1)*s6.length/tot)>i6;if(want6&&i6<s6.length)stand.push(s6[i6++]);else if(i5<s5.length)stand.push(s5[i5++]);else stand.push(s6[i6++]);}
  const caseKeys=Object.keys(CASES).sort((a,b)=>CASES[a].n-CASES[b].n);const out=[];
  caseKeys.forEach((ck,ci)=>{out.push(...stand.slice(ci*6,ci*6+6));out.push(...Q.filter(q=>q.cs===ck).map(q=>q.id));});
  out.push(...stand.slice(caseKeys.length*6));return out;})();

/* stars */
(function(){let h='';for(let i=0;i<60;i++)h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${(.2+Math.random()*.6).toFixed(2)}"></i>`;$('#stars').innerHTML=h;})();

/* rng */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(a,r){r=r||Math.random;for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- balanced answer positions ---------- */
function positionPlan(ids,rnd){const n=ids.length,plan=[];for(let i=0;i<n;i++)plan.push(i%4);shuffle(plan,rnd);
  for(let pass=0;pass<50;pass++){let ok=true;for(let i=2;i<n;i++){if(plan[i]===plan[i-1]&&plan[i]===plan[i-2]){ok=false;const j=Math.floor(rnd()*n);if(plan[j]!==plan[i]){[plan[i],plan[j]]=[plan[j],plan[i]];}}}if(ok)break;}
  const m={};ids.forEach((id,i)=>m[id]=plan[i]);return m;}
function optionOrders(randA){const rnd=randA?Math.random:mulberry(20261009);const opt={};
  const mcIds=DEFAULT_ORDER.filter(id=>QM[id].t==='mc');const plan=positionPlan(mcIds,rnd);
  const cIds=[];DEFAULT_ORDER.forEach(id=>{const q=QM[id];if(q.t==='cloze')q.blanks.forEach((b,bi)=>cIds.push(id+'#'+bi));});
  const cplan=(()=>{const n=cIds.length,p=[];for(let i=0;i<n;i++)p.push(i%3);shuffle(p,rnd);for(let i=1;i<n;i++){if(p[i]===p[i-1]){const j=(i+1)%n;if(p[j]!==p[i])[p[i],p[j]]=[p[j],p[i]];}}const m={};cIds.forEach((k,i)=>m[k]=p[i]);return m;})();
  DEFAULT_ORDER.forEach(id=>{const q=QM[id];const r=randA?Math.random:mulberry(hash(id));
    if(q.t==='mc'){const ci=q.o.findIndex(o=>o[1]);const rest=shuffle(q.o.map((_,i)=>i).filter(i=>i!==ci),r);rest.splice(plan[id],0,ci);opt[id]=rest;}
    else if(q.t==='sata'){opt[id]=shuffle(q.o.map((_,i)=>i),r);}
    else if(q.t==='cloze'){opt[id]=q.blanks.map((b,bi)=>{const ci=b[1];const rest=shuffle(b[0].map((_,i)=>i).filter(i=>i!==ci),r);rest.splice(Math.min(cplan[id+'#'+bi],rest.length),0,ci);return rest;});}
    else opt[id]=null;});
  return opt;}

/* ---------- state ---------- */
let S=null;
function blank(){return{phase:'start',mode:'study',randQ:false,randA:false,main:null,retry:null,finished:false,flags:{},view:'q'};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.phase)return s;}catch(e){}return null;}
S=load()||blank();
function build(mode,randQ,randA){
  const blocks=[];DEFAULT_ORDER.forEach(id=>{const q=QM[id];const last=blocks[blocks.length-1];if(q.cs&&last&&QM[last[0]].cs===q.cs)last.push(id);else blocks.push([id]);});
  if(randQ)shuffle(blocks);
  const ids=[].concat(...blocks);
